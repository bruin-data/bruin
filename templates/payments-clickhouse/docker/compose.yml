# Local verification stack for bruin-payments-clickhouse.
#
# Brings up the two systems the pipeline needs: the operational PostgreSQL
# system of record (configured for logical replication so Bruin CDC can read it)
# and a ClickHouse server that stands in for ClickHouse Cloud.
#
#   docker compose -f bruin-payments-clickhouse/docker/compose.yml up -d
#   docker compose -f bruin-payments-clickhouse/docker/compose.yml down -v
#
# Credentials here are local-only demo values and are referenced by the `local`
# environment in .bruin.yml.

name: bruin-payments-clickhouse

services:
    postgres:
        image: postgres:16
        container_name: bruin-payments-postgres
        environment:
            POSTGRES_USER: bruin
            POSTGRES_PASSWORD: bruin
            POSTGRES_DB: payments
        command:
            - postgres
            - -c
            - wal_level=logical
            - -c
            - max_replication_slots=8
            - -c
            - max_wal_senders=8
        ports:
            - "5432:5432"
        volumes:
            - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-payments.sql:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U bruin -d payments"]
            interval: 3s
            timeout: 3s
            retries: 20

    clickhouse:
        image: clickhouse/clickhouse-server:24.8
        container_name: bruin-payments-clickhouse
        environment:
            CLICKHOUSE_USER: bruin
            CLICKHOUSE_PASSWORD: bruin
            CLICKHOUSE_DB: bruin_payments
            CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
            - "8123:8123"
            - "9000:9000"
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        healthcheck:
            test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping || exit 1"]
            interval: 3s
            timeout: 3s
            retries: 20
