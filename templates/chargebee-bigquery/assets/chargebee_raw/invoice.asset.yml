name: chargebee_raw.invoice
type: ingestr

description: >
  Raw-layer Chargebee invoices loaded into BigQuery with ingestr's incremental
  mode. Each run fetches the invoices whose `updated_at` falls inside its own
  time window and merges them into the destination table on `id`, so payments,
  adjustments, and status changes on an existing invoice are picked up by the
  run whose window covers them, or by a wider backfill.

materialization:
  type: table
  strategy: merge
  incremental_key: updated_at

parameters:
  source_table: invoices

tags:
  - chargebee_raw
  - chargebee
  - billing

columns:
  - name: id
    type: varchar
    description: Chargebee invoice identifier.
    primary_key: true
    checks:
      - name: not_null
      - name: unique
  - name: customer_id
    type: varchar
    description: Identifier of the customer the invoice was raised for.
  - name: subscription_id
    type: varchar
    description: Identifier of the subscription the invoice was generated for, if any.
  - name: status
    type: varchar
    description: >
      Invoice status, one of `paid`, `posted`, `payment_due`, `not_paid`,
      `voided`, or `pending`.
  - name: price_type
    type: varchar
    description: Whether amounts are `tax_exclusive` or `tax_inclusive`.
  - name: currency_code
    type: varchar
    description: Three-letter ISO currency code the invoice is billed in.
  - name: total
    type: integer
    description: Invoice total in minor currency units.
  - name: amount_paid
    type: integer
    description: Amount paid against the invoice in minor currency units.
  - name: amount_due
    type: integer
    description: Amount still due on the invoice in minor currency units.
  - name: amount_adjusted
    type: integer
    description: Amount adjusted on the invoice in minor currency units.
  - name: credits_applied
    type: integer
    description: Credits applied to the invoice in minor currency units.
  - name: recurring
    type: boolean
    description: Whether the invoice was generated from a subscription.
  - name: first_invoice
    type: boolean
    description: Whether this is the first invoice raised for the subscription.
  - name: date
    type: integer
    description: Unix timestamp in seconds of when the invoice was generated.
  - name: due_date
    type: integer
    description: Unix timestamp in seconds of when payment is due.
  - name: paid_at
    type: integer
    description: Unix timestamp in seconds of when the invoice was paid.
  - name: updated_at
    type: integer
    description: Unix timestamp in seconds of the last modification to the invoice.
    checks:
      - name: not_null
  - name: deleted
    type: boolean
    description: Whether the invoice resource has been deleted.
