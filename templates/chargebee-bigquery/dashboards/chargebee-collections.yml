name: Chargebee Collections & Risk
description: "Finance and revenue-operations workspace: invoice-to-cash conversion, open AR exposure, and customer payment follow-up."
connection: gcp-default

filters:
  - name: date_range
    type: date-range
    default: all_time
  - name: currency
    type: text
    default: usd

queries:
  latest_collections:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      ), latest AS (
        SELECT MAX(invoice_billing_month) AS invoice_billing_month
        FROM `chargebee_reports.monthly_invoice_billings`
        WHERE invoice_billing_month >= CAST('{{ filters.date_range.start }}' AS DATE)
          AND invoice_billing_month <= CAST('{{ filters.date_range.end }}' AS DATE)
          AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
      )
      SELECT
        billing.invoice_billing_month,
        SUM(billed_total_minor) / (SELECT divisor FROM currency_units) AS billed,
        SUM(collected_total_minor) / (SELECT divisor FROM currency_units) AS collected,
        SUM(outstanding_due_minor) / (SELECT divisor FROM currency_units) AS outstanding,
        SUM(invoice_count) AS invoice_count,
        SUM(paid_invoice_count) AS paid_invoice_count,
        SAFE_DIVIDE(SUM(collected_total_minor), NULLIF(SUM(billed_total_minor), 0)) AS collection_rate,
        SAFE_DIVIDE(SUM(paid_invoice_count), NULLIF(SUM(invoice_count), 0)) AS paid_invoice_rate
      FROM `chargebee_reports.monthly_invoice_billings` AS billing, latest
      WHERE billing.invoice_billing_month = latest.invoice_billing_month
        AND LOWER(billing.currency_code) = LOWER('{{ filters.currency }}')
      GROUP BY 1

  invoice_status:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      ), latest AS (
        SELECT MAX(DATE(invoice_date)) AS invoice_date
        FROM `chargebee_stage.invoices`
        WHERE DATE(invoice_date) >= CAST('{{ filters.date_range.start }}' AS DATE)
          AND DATE(invoice_date) <= CAST('{{ filters.date_range.end }}' AS DATE)
          AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
      )
      SELECT
        invoice_status AS status,
        COUNT(*) AS invoices,
        SUM(invoice_total_minor) / (SELECT divisor FROM currency_units) AS billed,
        SUM(amount_due_minor) / (SELECT divisor FROM currency_units) AS outstanding
      FROM `chargebee_stage.invoices` AS invoice, latest
      WHERE DATE(invoice.invoice_date) = latest.invoice_date
        AND LOWER(invoice.currency_code) = LOWER('{{ filters.currency }}')
        AND invoice.invoice_status != 'voided'
      GROUP BY 1
      ORDER BY outstanding DESC, billed DESC

  payment_risk_summary:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      ), latest_invoice AS (
        SELECT MAX(DATE(invoice_date)) AS invoice_date
        FROM `chargebee_stage.invoices`
        WHERE LOWER(currency_code) = LOWER('{{ filters.currency }}')
      )
      SELECT
        COUNTIF(amount_due_minor > 0) AS open_invoices,
        SUM(IF(amount_due_minor > 0, amount_due_minor, CAST(0 AS NUMERIC)))
          / (SELECT divisor FROM currency_units) AS open_ar,
        COUNTIF(amount_due_minor > 0 AND DATE(invoice_due_at) < latest_invoice.invoice_date) AS overdue_invoices,
        SUM(IF(
          amount_due_minor > 0 AND DATE(invoice_due_at) < latest_invoice.invoice_date,
          amount_due_minor,
          CAST(0 AS NUMERIC)
        )) / (SELECT divisor FROM currency_units) AS overdue_ar
      FROM `chargebee_stage.invoices`, latest_invoice
      WHERE LOWER(currency_code) = LOWER('{{ filters.currency }}')
        AND invoice_status != 'voided'

  risk_queue:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      ), latest_invoice AS (
        SELECT MAX(DATE(invoice_date)) AS invoice_date
        FROM `chargebee_stage.invoices`
        WHERE LOWER(currency_code) = LOWER('{{ filters.currency }}')
      ), latest_mrr AS (
        SELECT MAX(metric_month) AS metric_month
        FROM `chargebee_reports.monthly_mrr_by_customer`
        WHERE LOWER(currency_code) = LOWER('{{ filters.currency }}')
      )
      SELECT
        COALESCE(NULLIF(customer.company_name, ''), customer.customer_name, invoice.chargebee_customer_id) AS account,
        invoice.chargebee_customer_id,
        invoice.chargebee_invoice_id,
        invoice.invoice_status AS status,
        DATE(invoice.invoice_due_at) AS due_date,
        DATE_DIFF(latest_invoice.invoice_date, DATE(invoice.invoice_due_at), DAY) AS days_past_due,
        invoice.amount_due_minor / (SELECT divisor FROM currency_units) AS amount_due,
        COALESCE(mrr.ending_mrr_minor, 0) / (SELECT divisor FROM currency_units) AS mrr_exposed,
        CASE
          WHEN DATE(invoice.invoice_due_at) < DATE_SUB(latest_invoice.invoice_date, INTERVAL 30 DAY)
            THEN 'Escalate · 30+ days'
          WHEN DATE(invoice.invoice_due_at) < latest_invoice.invoice_date
            THEN 'Follow up · overdue'
          ELSE 'Confirm payment method'
        END AS recommended_action
      FROM `chargebee_stage.invoices` AS invoice
      CROSS JOIN latest_invoice
      CROSS JOIN latest_mrr
      LEFT JOIN `chargebee_stage.customers` AS customer
        USING (chargebee_customer_id)
      LEFT JOIN `chargebee_reports.monthly_mrr_by_customer` AS mrr
        ON invoice.chargebee_customer_id = mrr.chargebee_customer_id
        AND mrr.currency_code = invoice.currency_code
        AND mrr.metric_month = latest_mrr.metric_month
      WHERE invoice.amount_due_minor > 0
        AND invoice.invoice_status != 'voided'
        AND LOWER(invoice.currency_code) = LOWER('{{ filters.currency }}')
      QUALIFY ROW_NUMBER() OVER (
        PARTITION BY invoice.chargebee_customer_id
        ORDER BY invoice.amount_due_minor DESC, invoice.invoice_due_at
      ) = 1
      ORDER BY amount_due DESC, mrr_exposed DESC
      LIMIT 30

  recurring_vs_total:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      )
      SELECT
        invoice_billing_month,
        billed_recurring_minor / (SELECT divisor FROM currency_units) AS recurring,
        billed_one_time_minor / (SELECT divisor FROM currency_units) AS one_time,
        collected_total_minor / (SELECT divisor FROM currency_units) AS collected,
        outstanding_due_minor / (SELECT divisor FROM currency_units) AS outstanding
      FROM `chargebee_reports.monthly_invoice_billings`
      WHERE invoice_billing_month >= CAST('{{ filters.date_range.start }}' AS DATE)
        AND invoice_billing_month <= CAST('{{ filters.date_range.end }}' AS DATE)
        AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
      ORDER BY invoice_billing_month

rows:
  - widgets:
      - name: Collections & payment risk
        type: text
        content: |
          # Collections & payment risk

          This tab answers **are invoices turning into cash, and which accounts need a human follow-up?** It intentionally separates invoiced billings from recurring MRR.

          **Coverage note:** the sandbox export contains no gateway failure attempts, so “payment-risk MRR” below is an open-invoice leading indicator—not a claim that every open invoice is involuntary churn. Once transaction-level failures and retries are synced, this queue can be upgraded to failed → recovered → exhausted dunning states.
        col: 12

  - widgets:
      - name: Latest billed
        type: metric
        query: latest_collections
        column: billed
        format: "$,.0f"
        col: 3
      - name: Latest collected
        type: metric
        query: latest_collections
        column: collected
        format: "$,.0f"
        col: 3
      - name: Latest outstanding
        type: metric
        query: latest_collections
        column: outstanding
        format: "$,.0f"
        col: 3
      - name: Paid invoice rate
        type: metric
        query: latest_collections
        column: paid_invoice_rate
        format: ".0%"
        col: 3

  - widgets:
      - name: Open AR / payment-risk exposure
        type: metric
        query: payment_risk_summary
        column: open_ar
        format: "$,.0f"
        col: 3
      - name: Open invoices
        type: metric
        query: payment_risk_summary
        column: open_invoices
        format: ",.0f"
        col: 3
      - name: Overdue AR
        type: metric
        query: payment_risk_summary
        column: overdue_ar
        format: "$,.0f"
        col: 3
      - name: Collection rate
        type: metric
        query: latest_collections
        column: collection_rate
        format: ".0%"
        col: 3

  - widgets:
      - name: Billed vs collected vs outstanding
        type: table
        query: recurring_vs_total
        col: 12
        columns:
          - name: invoice_billing_month
            label: Month
          - name: recurring
            label: Recurring billed
            format: "$,.0f"
          - name: one_time
            label: One-time billed
            format: "$,.0f"
          - name: collected
            label: Collected
            format: "$,.0f"
          - name: outstanding
            label: Outstanding
            format: "$,.0f"

  - widgets:
      - name: Payment follow-up queue
        type: table
        query: risk_queue
        col: 12
        columns:
          - name: account
            label: Account
          - name: chargebee_invoice_id
            label: Invoice
          - name: status
            label: Status
          - name: due_date
            label: Due date
          - name: days_past_due
            label: Days past due
            format: ",.0f"
          - name: amount_due
            label: Open amount
            format: "$,.0f"
          - name: mrr_exposed
            label: MRR exposed
            format: "$,.0f"
          - name: recommended_action
            label: Recommended action

  - widgets:
      - name: Finance interpretation
        type: text
        content: |
          **What this means:** an open invoice is a collections task, not recognized revenue and not automatically a failed payment. For production, join the transaction ledger and dunning events to show recovery rate, last attempt, failure reason, and cancellation exposure per account.
        col: 12
