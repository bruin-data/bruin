name: Chargebee Retention & Expansion
description: "Retention and expansion workspace: cohort durability, churn drivers, reactivation, and accounts changing MRR."
connection: gcp-default

filters:
  - name: date_range
    type: date-range
    default: all_time
  - name: currency
    type: text
    default: usd

queries:
  retention_trend:
    sql: |
      SELECT
        metric_month,
        gross_revenue_retention_rate AS grr,
        net_revenue_retention_rate_excluding_reactivation AS nrr,
        logo_churn_rate
      FROM `chargebee_reports.monthly_subscription_kpis`
      WHERE metric_month >= CAST('{{ filters.date_range.start }}' AS DATE)
        AND metric_month <= CAST('{{ filters.date_range.end }}' AS DATE)
        AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
      ORDER BY metric_month

  movement_trend:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      )
      SELECT
        metric_month,
        movement_type,
        SUM(
          CASE movement_type
            WHEN 'new' THEN new_mrr_minor
            WHEN 'reactivation' THEN reactivation_mrr_minor
            WHEN 'expansion' THEN expansion_mrr_minor
            WHEN 'contraction' THEN -contraction_mrr_minor
            WHEN 'churn' THEN -churned_mrr_minor
            ELSE 0
          END
        ) / (SELECT divisor FROM currency_units) AS movement_mrr,
        COUNTIF(movement_type IN ('new', 'reactivation', 'churn')) AS logo_count
      FROM `chargebee_reports.monthly_mrr_movements`
      WHERE metric_month >= CAST('{{ filters.date_range.start }}' AS DATE)
        AND metric_month <= CAST('{{ filters.date_range.end }}' AS DATE)
        AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
        AND movement_type IN ('new', 'reactivation', 'expansion', 'contraction', 'churn')
      GROUP BY 1, 2
      HAVING movement_mrr != 0
      ORDER BY metric_month, movement_type

  cohort_retention:
    sql: |
      WITH history AS (
        SELECT
          metric_month,
          chargebee_customer_id,
          currency_code,
          ending_mrr_minor
        FROM `chargebee_reports.monthly_mrr_by_customer`
        WHERE LOWER(currency_code) = LOWER('{{ filters.currency }}')
      ),
      first_positive AS (
        SELECT
          chargebee_customer_id,
          currency_code,
          MIN(metric_month) AS cohort_month
        FROM history
        WHERE ending_mrr_minor > 0
        GROUP BY 1, 2
      ),
      cohort_rows AS (
        SELECT
          first_positive.cohort_month,
          history.metric_month,
          history.chargebee_customer_id,
          history.ending_mrr_minor,
          MAX(IF(
            history.metric_month = first_positive.cohort_month,
            history.ending_mrr_minor,
            CAST(0 AS NUMERIC)
          )) OVER (
            PARTITION BY history.chargebee_customer_id, history.currency_code
          ) AS cohort_mrr_minor
        FROM history
        INNER JOIN first_positive
          USING (chargebee_customer_id, currency_code)
        WHERE history.metric_month >= first_positive.cohort_month
      )
      SELECT
        cohort_month,
        DATE_DIFF(metric_month, cohort_month, MONTH) AS months_since_start,
        COUNT(DISTINCT chargebee_customer_id) AS cohort_customers,
        SAFE_DIVIDE(
          SUM(ending_mrr_minor),
          NULLIF(SUM(cohort_mrr_minor), 0)
        ) AS mrr_retention,
        SAFE_DIVIDE(
          COUNTIF(ending_mrr_minor > 0),
          COUNT(DISTINCT chargebee_customer_id)
        ) AS logo_retention
      FROM cohort_rows
      WHERE metric_month >= CAST('{{ filters.date_range.start }}' AS DATE)
        AND metric_month <= CAST('{{ filters.date_range.end }}' AS DATE)
      GROUP BY 1, 2
      ORDER BY cohort_month, months_since_start

  churn_by_channel:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      ), latest AS (
        SELECT MAX(metric_month) AS metric_month
        FROM `chargebee_reports.monthly_mrr_movements`
        WHERE metric_month >= CAST('{{ filters.date_range.start }}' AS DATE)
          AND metric_month <= CAST('{{ filters.date_range.end }}' AS DATE)
          AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
      )
      SELECT
        COALESCE(NULLIF(acquisition_channel, ''), 'Unknown') AS channel,
        COUNTIF(movement_type = 'churn') AS churned_customers,
        SAFE_DIVIDE(
          SUM(churned_mrr_minor),
          NULLIF(SUM(beginning_mrr_minor), 0)
        ) AS revenue_churn_rate,
        SUM(churned_mrr_minor) / (SELECT divisor FROM currency_units) AS churned_mrr
      FROM `chargebee_reports.monthly_mrr_movements` AS movement, latest
      WHERE movement.metric_month = latest.metric_month
        AND LOWER(movement.currency_code) = LOWER('{{ filters.currency }}')
        AND has_contiguous_prior_snapshot
      GROUP BY 1
      HAVING churned_customers > 0
      ORDER BY churned_mrr DESC

  movement_accounts:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      ), latest AS (
        SELECT MAX(metric_month) AS metric_month
        FROM `chargebee_reports.monthly_mrr_movements`
        WHERE metric_month >= CAST('{{ filters.date_range.start }}' AS DATE)
          AND metric_month <= CAST('{{ filters.date_range.end }}' AS DATE)
          AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
      )
      SELECT
        latest.metric_month,
        movement.chargebee_customer_id,
        COALESCE(NULLIF(customer.company_name, ''), customer.customer_name, movement.chargebee_customer_id) AS company,
        COALESCE(NULLIF(movement.acquisition_channel, ''), 'Unknown') AS channel,
        movement.movement_type,
        CASE movement.movement_type
          WHEN 'expansion' THEN movement.expansion_mrr_minor
          WHEN 'contraction' THEN -movement.contraction_mrr_minor
          WHEN 'churn' THEN -movement.churned_mrr_minor
          WHEN 'reactivation' THEN movement.reactivation_mrr_minor
          ELSE movement.new_mrr_minor
        END / (SELECT divisor FROM currency_units) AS mrr_change,
        movement.beginning_mrr_minor / (SELECT divisor FROM currency_units) AS beginning_mrr
      FROM `chargebee_reports.monthly_mrr_movements` AS movement
      INNER JOIN latest
        ON movement.metric_month = latest.metric_month
      LEFT JOIN `chargebee_stage.customers` AS customer
        USING (chargebee_customer_id)
      WHERE LOWER(movement.currency_code) = LOWER('{{ filters.currency }}')
        AND movement.movement_type IN ('expansion', 'contraction', 'churn', 'reactivation')
      ORDER BY ABS(mrr_change) DESC, company
      LIMIT 30

  renewal_watch:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      )
      SELECT
        COALESCE(NULLIF(customer.company_name, ''), customer.customer_name, subscription.chargebee_customer_id) AS company,
        subscription.chargebee_customer_id,
        DATE(subscription.current_term_ends_at) AS term_ends,
        subscription.subscription_status AS status,
        subscription.subscription_mrr_minor / (SELECT divisor FROM currency_units) AS mrr
      FROM `chargebee_stage.subscriptions` AS subscription
      LEFT JOIN `chargebee_stage.customers` AS customer
        USING (chargebee_customer_id)
      WHERE LOWER(subscription.currency_code) = LOWER('{{ filters.currency }}')
        AND subscription.subscription_status = 'non_renewing'
      ORDER BY term_ends, mrr DESC
      LIMIT 25

rows:
  - widgets:
      - name: Retention & expansion
        type: text
        content: |
          # Retention & expansion

          This is the “why” behind the MRR number. Cohorts show whether customers keep value over time; movements show what changed last month; the watchlists turn those changes into customer-success work.

          Chargebee’s cancellation reason is not present in this sandbox export, so churn is shown by observed MRR movement. Add CRM/product-health joins here when available.
        col: 12

  - widgets:
      - name: GRR over time
        type: chart
        chart: line
        query: retention_trend
        x: metric_month
        y: [grr, nrr]
        col: 7
      - name: Revenue churn rate
        type: chart
        chart: line
        query: retention_trend
        x: metric_month
        y: [logo_churn_rate]
        col: 5

  - widgets:
      - name: MRR movement by month
        type: chart
        chart: bar
        query: movement_trend
        x: metric_month
        y: [movement_mrr]
        stacked: true
        col: 7
      - name: Churned MRR by acquisition channel
        type: chart
        chart: bar
        query: churn_by_channel
        x: channel
        y: [churned_mrr]
        col: 5

  - widgets:
      - name: Cohort retention curve
        type: chart
        chart: line
        query: cohort_retention
        x: months_since_start
        y: [mrr_retention, logo_retention]
        col: 7
      - name: Non-renewing subscriptions
        type: table
        query: renewal_watch
        col: 5
        columns:
          - name: company
            label: Account
          - name: term_ends
            label: Term ends
          - name: status
            label: Status
          - name: mrr
            label: MRR
            format: "$,.0f"

  - widgets:
      - name: Latest movement accounts
        type: table
        query: movement_accounts
        col: 12
        columns:
          - name: company
            label: Account
          - name: channel
            label: Channel
          - name: movement_type
            label: Movement
          - name: mrr_change
            label: MRR change
            format: "$,.0f"
          - name: beginning_mrr
            label: Prior MRR
            format: "$,.0f"
