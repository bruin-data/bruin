name: Chargebee Monetization & Portfolio
description: "Product packaging and customer portfolio view: plan mix, price bands, add-ons, and revenue exposure."
connection: gcp-default

filters:
  - name: date_range
    type: date-range
    default: all_time
  - name: currency
    type: text
    default: usd

queries:
  plan_mix:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      ), totals AS (
        SELECT SUM(monthly_mrr_minor) AS total_mrr
        FROM `chargebee_reports.mrr_by_plan`
        WHERE LOWER(currency_code) = LOWER('{{ filters.currency }}')
      )
      SELECT
        CASE
          WHEN item_type = 'addon' THEN 'Add-on · ' || item_price_id
          ELSE CONCAT(UPPER('{{ filters.currency }}'), ' ', REGEXP_EXTRACT(item_price_id, r'-(\d+)-monthly'), ' base plan')
        END AS plan_label,
        item_type,
        active_subscription_count AS active_subscriptions,
        monthly_mrr_minor / (SELECT divisor FROM currency_units) AS mrr,
        SAFE_DIVIDE(monthly_mrr_minor, NULLIF((SELECT total_mrr FROM totals), 0)) AS mrr_share,
        SAFE_DIVIDE(
          monthly_mrr_minor / (SELECT divisor FROM currency_units),
          NULLIF(active_subscription_count, 0)
        ) AS arpa
      FROM `chargebee_reports.mrr_by_plan`
      WHERE LOWER(currency_code) = LOWER('{{ filters.currency }}')
      ORDER BY mrr DESC

  customer_bands:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      ), latest AS (
        SELECT MAX(metric_month) AS metric_month
        FROM `chargebee_reports.monthly_mrr_by_customer`
        WHERE metric_month >= CAST('{{ filters.date_range.start }}' AS DATE)
          AND metric_month <= CAST('{{ filters.date_range.end }}' AS DATE)
          AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
      )
      SELECT
        CASE
          WHEN ending_mrr_minor < 25000 THEN 'Under $250'
          WHEN ending_mrr_minor < 50000 THEN '$250–$499'
          WHEN ending_mrr_minor < 100000 THEN '$500–$999'
          ELSE '$1,000+'
        END AS mrr_band,
        COUNT(*) AS customers,
        SUM(ending_mrr_minor) / (SELECT divisor FROM currency_units) AS mrr,
        SAFE_DIVIDE(
          SUM(ending_mrr_minor) / (SELECT divisor FROM currency_units),
          COUNT(*)
        ) AS arpa
      FROM `chargebee_reports.monthly_mrr_by_customer` AS mrr, latest
      WHERE mrr.metric_month = latest.metric_month
        AND LOWER(mrr.currency_code) = LOWER('{{ filters.currency }}')
        AND mrr.ending_mrr_minor > 0
      GROUP BY 1
      ORDER BY MIN(ending_mrr_minor)

  plan_table:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      ), totals AS (
        SELECT SUM(monthly_mrr_minor) AS total_mrr
        FROM `chargebee_reports.mrr_by_plan`
        WHERE LOWER(currency_code) = LOWER('{{ filters.currency }}')
      )
      SELECT
        CASE
          WHEN item_type = 'addon' THEN 'Add-on · ' || item_price_id
          ELSE CONCAT(UPPER('{{ filters.currency }}'), ' ', REGEXP_EXTRACT(item_price_id, r'-(\d+)-monthly'), ' base plan')
        END AS plan,
        item_type,
        active_subscription_count AS customers,
        total_quantity AS units,
        monthly_mrr_minor / (SELECT divisor FROM currency_units) AS mrr,
        SAFE_DIVIDE(monthly_mrr_minor, NULLIF((SELECT total_mrr FROM totals), 0)) AS mrr_share,
        run_rate_arr_minor / (SELECT divisor FROM currency_units) AS arr
      FROM `chargebee_reports.mrr_by_plan`
      WHERE LOWER(currency_code) = LOWER('{{ filters.currency }}')
      ORDER BY mrr DESC

rows:
  - widgets:
      - name: Monetization & portfolio
        type: text
        content: |
          # Monetization & portfolio

          Use this view to decide **where packaging and customer mix are helping or holding back growth**. Plan-level MRR is current-state; the customer bands reveal whether the portfolio is broad-based or dependent on a narrow price tier.

          Friendly labels are derived from Chargebee item-price IDs. Add catalog metadata for richer plan and add-on names in production.
        col: 12

  - widgets:
      - name: MRR by plan
        type: chart
        chart: bar
        query: plan_mix
        x: plan_label
        y: [mrr]
        col: 7
      - name: Customers by MRR band
        type: chart
        chart: bar
        query: customer_bands
        x: mrr_band
        y: [customers]
        col: 5

  - widgets:
      - name: Plan portfolio table
        type: table
        query: plan_table
        col: 12
        columns:
          - name: plan
            label: Package
          - name: item_type
            label: Type
          - name: customers
            label: Customers
            format: ",.0f"
          - name: units
            label: Units
            format: ",.0f"
          - name: mrr
            label: MRR
            format: "$,.0f"
          - name: mrr_share
            label: MRR share
            format: ".1%"
          - name: arr
            label: Run-rate ARR
            format: "$,.0f"

  - widgets:
      - name: Packaging readout
        type: text
        content: |
          **Questions to take into the next pricing review:**

          - Is the highest-value tier growing through upgrades, or is it only the largest because of the list price?
          - Are add-ons attached to enough accounts to justify packaging and enablement work?
          - Is ARPA rising alongside active logos, or are we buying growth at the low end?
          - Which plan bands have the highest churn and expansion once CRM and product-usage data are joined?
        col: 12
