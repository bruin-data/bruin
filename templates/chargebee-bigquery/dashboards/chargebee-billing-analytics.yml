name: Chargebee Billing Analytics
description: Recurring-revenue, retention, plan, concentration, and dunning KPIs from the chargebee_reports layer, per native currency.
connection: gcp-default

filters:
  - name: date_range
    type: date-range
    default: all_time
  - name: currency
    type: text
    default: usd

queries:
  latest_subscription_kpis:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS minor_unit_divisor
      )
      SELECT
        metric_month,
        currency_code,
        ending_mrr_minor
          / (SELECT minor_unit_divisor FROM currency_units) AS ending_mrr,
        ending_run_rate_arr_minor
          / (SELECT minor_unit_divisor FROM currency_units) AS ending_run_rate_arr,
        ending_active_customer_count,
        net_revenue_retention_rate_excluding_reactivation AS nrr,
        gross_revenue_retention_rate AS grr,
        quick_ratio,
        logo_churn_rate,
        average_revenue_per_active_customer_minor
          / (SELECT minor_unit_divisor FROM currency_units) AS arpa
      FROM `chargebee_reports.monthly_subscription_kpis`
      WHERE metric_month >= CAST('{{ filters.date_range.start }}' AS DATE)
        AND metric_month <= CAST('{{ filters.date_range.end }}' AS DATE)
        AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
      QUALIFY ROW_NUMBER() OVER (ORDER BY metric_month DESC) = 1

  latest_dunning:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS minor_unit_divisor
      )
      SELECT
        payment_success_rate,
        at_risk_failed_amount_minor
          / (SELECT minor_unit_divisor FROM currency_units) AS at_risk_failed_amount,
        recoverable_failed_amount_minor
          / (SELECT minor_unit_divisor FROM currency_units) AS recoverable_failed_amount
      FROM `chargebee_reports.failed_payment_dunning`
      WHERE LOWER(currency_code) = LOWER('{{ filters.currency }}')
      QUALIFY ROW_NUMBER() OVER (ORDER BY as_of_date DESC) = 1

  monthly_mrr:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS minor_unit_divisor
      )
      SELECT
        metric_month,
        SUM(ending_mrr_minor)
          / (SELECT minor_unit_divisor FROM currency_units) AS ending_mrr
      FROM `chargebee_reports.monthly_mrr_by_customer`
      WHERE metric_month >= CAST('{{ filters.date_range.start }}' AS DATE)
        AND metric_month <= CAST('{{ filters.date_range.end }}' AS DATE)
        AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
      GROUP BY metric_month
      ORDER BY metric_month

  monthly_mrr_movements:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS minor_unit_divisor
      ),
      monthly_movements AS (
        SELECT
          metric_month,
          SUM(new_mrr_minor)
            / (SELECT minor_unit_divisor FROM currency_units) AS new_mrr,
          SUM(reactivation_mrr_minor)
            / (SELECT minor_unit_divisor FROM currency_units) AS reactivation_mrr,
          SUM(expansion_mrr_minor)
            / (SELECT minor_unit_divisor FROM currency_units) AS expansion_mrr,
          -SUM(contraction_mrr_minor)
            / (SELECT minor_unit_divisor FROM currency_units) AS contraction_mrr_loss,
          -SUM(churned_mrr_minor)
            / (SELECT minor_unit_divisor FROM currency_units) AS churned_mrr_loss
        FROM `chargebee_reports.monthly_mrr_movements`
        WHERE metric_month >= CAST('{{ filters.date_range.start }}' AS DATE)
          AND metric_month <= CAST('{{ filters.date_range.end }}' AS DATE)
          AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
        GROUP BY metric_month
      )
      SELECT
        metric_month,
        movement_category,
        movement_mrr
      FROM monthly_movements,
      UNNEST([
        STRUCT('New' AS movement_category, new_mrr AS movement_mrr),
        STRUCT('Reactivation', reactivation_mrr),
        STRUCT('Expansion', expansion_mrr),
        STRUCT('Contraction', contraction_mrr_loss),
        STRUCT('Churn', churned_mrr_loss)
      ])
      ORDER BY metric_month, movement_category

  mrr_by_plan:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS minor_unit_divisor
      )
      SELECT
        item_price_id,
        item_type,
        active_subscription_count,
        monthly_mrr_minor
          / (SELECT minor_unit_divisor FROM currency_units) AS monthly_mrr,
        run_rate_arr_minor
          / (SELECT minor_unit_divisor FROM currency_units) AS run_rate_arr
      FROM `chargebee_reports.mrr_by_plan`
      WHERE LOWER(currency_code) = LOWER('{{ filters.currency }}')
      ORDER BY monthly_mrr DESC
      LIMIT 20

  revenue_concentration:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS minor_unit_divisor
      )
      SELECT
        customer_rank,
        COALESCE(
          NULLIF(TRIM(customer_name), ''),
          NULLIF(TRIM(company_name), ''),
          chargebee_customer_id
        ) AS customer_label,
        ending_mrr_minor
          / (SELECT minor_unit_divisor FROM currency_units) AS ending_mrr,
        pct_of_currency_mrr,
        cumulative_pct_of_currency_mrr
      FROM `chargebee_reports.revenue_concentration`
      WHERE LOWER(currency_code) = LOWER('{{ filters.currency }}')
      ORDER BY customer_rank

  latest_customer_mrr:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS minor_unit_divisor
      ),
      filtered AS (
        SELECT
          metric_month,
          chargebee_customer_id,
          COALESCE(
            NULLIF(TRIM(customer_name), ''),
            NULLIF(TRIM(company_name), ''),
            chargebee_customer_id
          ) AS customer_label,
          company_name,
          acquisition_channel,
          active_subscription_count,
          ending_mrr_minor
            / (SELECT minor_unit_divisor FROM currency_units) AS ending_mrr,
          run_rate_arr_minor
            / (SELECT minor_unit_divisor FROM currency_units) AS run_rate_arr
        FROM `chargebee_reports.monthly_mrr_by_customer`
        WHERE metric_month >= CAST('{{ filters.date_range.start }}' AS DATE)
          AND metric_month <= CAST('{{ filters.date_range.end }}' AS DATE)
          AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
      )
      SELECT *
      FROM filtered
      QUALIFY metric_month = MAX(metric_month) OVER ()
      ORDER BY ending_mrr DESC, chargebee_customer_id
      LIMIT 20

  monthly_invoice_billings:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS minor_unit_divisor
      ),
      monthly AS (
        SELECT
          invoice_billing_month,
          SUM(billed_recurring_minor)
            / (SELECT minor_unit_divisor FROM currency_units) AS recurring,
          SUM(billed_one_time_minor)
            / (SELECT minor_unit_divisor FROM currency_units) AS one_time
        FROM `chargebee_reports.monthly_invoice_billings`
        WHERE invoice_billing_month >= CAST('{{ filters.date_range.start }}' AS DATE)
          AND invoice_billing_month <= CAST('{{ filters.date_range.end }}' AS DATE)
          AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
        GROUP BY invoice_billing_month
      )
      SELECT
        invoice_billing_month,
        billing_category,
        billed_amount
      FROM monthly,
      UNNEST([
        STRUCT('Recurring' AS billing_category, recurring AS billed_amount),
        STRUCT('One-time', one_time)
      ])
      ORDER BY invoice_billing_month, billing_category

rows:
  - widgets:
      - name: Dashboard overview
        type: text
        content: |
          # Chargebee billing analytics

          Recurring revenue and billings are shown for one native currency at a time. Enter a three-letter currency code (e.g. `usd`) to avoid aggregating monetary amounts across currencies.

          **Metric policy:** MRR is the Chargebee-computed run rate from MRR-eligible subscriptions (default: active and non_renewing). It is not recognized revenue, bookings, or cash. The `chargebee_reports` tables store money in native minor units; these widgets divide by the currency's exponent to display major units, and apply no FX conversion.
        col: 12

  - widgets:
      - name: Latest Ending MRR
        type: metric
        query: latest_subscription_kpis
        column: ending_mrr
        format: ",.2f"
        col: 3

      - name: Run-Rate ARR
        type: metric
        query: latest_subscription_kpis
        column: ending_run_rate_arr
        format: ",.2f"
        col: 3

      - name: Active Customers
        type: metric
        query: latest_subscription_kpis
        column: ending_active_customer_count
        format: ",.0f"
        col: 3

      - name: ARPA
        type: metric
        query: latest_subscription_kpis
        column: arpa
        format: ",.2f"
        col: 3

  - widgets:
      - name: Net Revenue Retention
        type: metric
        query: latest_subscription_kpis
        column: nrr
        format: ".1%"
        col: 3

      - name: Gross Revenue Retention
        type: metric
        query: latest_subscription_kpis
        column: grr
        format: ".1%"
        col: 3

      - name: Quick Ratio
        type: metric
        query: latest_subscription_kpis
        column: quick_ratio
        format: ",.2f"
        col: 3

      - name: Payment Success Rate
        type: metric
        query: latest_dunning
        column: payment_success_rate
        format: ".1%"
        col: 3

  - widgets:
      - name: Snapshot history status
        type: text
        content: |
          **Snapshot history:** The first observed month is a baseline. MRR movement and retention (NRR, GRR, quick ratio) become available only after a second contiguous monthly snapshot, so those tiles and the movement chart can be empty until then.
        col: 12

  - widgets:
      - name: Monthly Ending MRR
        type: chart
        chart: line
        query: monthly_mrr
        x: metric_month
        y: [ending_mrr]
        col: 6

      - name: MRR Movement Components (requires prior snapshot)
        type: chart
        chart: bar
        query: monthly_mrr_movements
        x: metric_month
        y: [movement_mrr]
        stacked: true
        col: 6

  - widgets:
      - name: MRR by Plan / Add-on
        type: chart
        chart: bar
        query: mrr_by_plan
        x: item_price_id
        y: [monthly_mrr]
        col: 6

      - name: Monthly Invoice Billings (recurring vs one-time)
        type: chart
        chart: bar
        query: monthly_invoice_billings
        x: invoice_billing_month
        y: [billed_amount]
        stacked: true
        col: 6

  - widgets:
      - name: Revenue Concentration (top customers)
        type: chart
        chart: bar
        query: revenue_concentration
        x: customer_label
        y: [ending_mrr]
        col: 6

      - name: Involuntary-churn risk
        type: metric
        query: latest_dunning
        column: at_risk_failed_amount
        format: ",.2f"
        col: 6

  - widgets:
      - name: Latest Customer MRR Detail
        type: table
        query: latest_customer_mrr
        col: 12
        columns:
          - name: customer_label
            label: Customer
          - name: company_name
            label: Company
          - name: acquisition_channel
            label: Channel
          - name: chargebee_customer_id
            label: Chargebee customer
          - name: active_subscription_count
            label: Active subscriptions
          - name: ending_mrr
            label: Ending MRR
            format: ",.2f"
          - name: run_rate_arr
            label: Run-rate ARR
            format: ",.2f"

  - widgets:
      - name: Sources and limitations
        type: text
        content: |
          **Sources:** `chargebee_reports.monthly_mrr_by_customer`, `monthly_mrr_movements`, `monthly_subscription_kpis`, `monthly_invoice_billings`, `mrr_by_plan`, `revenue_concentration`, and `failed_payment_dunning`.

          **Method:** MRR is the Chargebee-computed subscription run rate summed per customer and currency. The movement chart treats contraction and churn as negative and reconciles to ending MRR only for contiguous monthly snapshots. Involuntary-churn risk is the failed-payment amount older than the dunning retry window.

          **Limitations:** The first snapshot month is a baseline, so retention and movement metrics may be unavailable until the next contiguous monthly observation. Amounts are shown in the selected currency's major units; no FX conversion is applied.
        col: 12
