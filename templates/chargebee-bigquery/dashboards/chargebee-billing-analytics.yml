name: Chargebee Executive
description: "Executive SaaS growth cockpit: MRR momentum, retention quality, cash conversion, and portfolio exposure by native currency."
connection: gcp-default

filters:
  - name: date_range
    type: date-range
    default: all_time
  - name: currency
    type: text
    default: usd

queries:
  latest_kpis:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      ),
      ranked AS (
        SELECT
          kpi.*,
          LAG(ending_mrr_minor) OVER (ORDER BY metric_month) AS prior_mrr_minor
        FROM `chargebee_reports.monthly_subscription_kpis` AS kpi
        WHERE LOWER(currency_code) = LOWER('{{ filters.currency }}')
      ),
      selected AS (
        SELECT
          ranked.*,
          ROW_NUMBER() OVER (ORDER BY metric_month DESC) AS month_rank
        FROM ranked
        WHERE metric_month >= CAST('{{ filters.date_range.start }}' AS DATE)
          AND metric_month <= CAST('{{ filters.date_range.end }}' AS DATE)
      )
      SELECT
        metric_month,
        ending_mrr_minor / (SELECT divisor FROM currency_units) AS ending_mrr,
        ending_run_rate_arr_minor / (SELECT divisor FROM currency_units) AS ending_arr,
        ending_active_customer_count AS active_customers,
        average_revenue_per_active_customer_minor / (SELECT divisor FROM currency_units) AS arpa,
        net_revenue_retention_rate_excluding_reactivation AS nrr,
        gross_revenue_retention_rate AS grr,
        logo_churn_rate,
        quick_ratio,
        (
          new_mrr_minor + reactivation_mrr_minor + expansion_mrr_minor
          - contraction_mrr_minor - churned_mrr_minor
        ) / (SELECT divisor FROM currency_units) AS net_new_mrr,
        SAFE_DIVIDE(ending_mrr_minor - prior_mrr_minor, NULLIF(prior_mrr_minor, 0)) AS mrr_growth
      FROM selected
      WHERE month_rank = 1

  monthly_mrr:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      )
      SELECT
        metric_month,
        SUM(ending_mrr_minor) / (SELECT divisor FROM currency_units) AS ending_mrr,
        COUNTIF(ending_mrr_minor > 0) AS active_customers
      FROM `chargebee_reports.monthly_mrr_by_customer`
      WHERE metric_month >= CAST('{{ filters.date_range.start }}' AS DATE)
        AND metric_month <= CAST('{{ filters.date_range.end }}' AS DATE)
        AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
      GROUP BY metric_month
      ORDER BY metric_month

  mrr_movement:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      ),
      monthly AS (
        SELECT
          metric_month,
          SUM(new_mrr_minor) / (SELECT divisor FROM currency_units) AS new_mrr,
          SUM(reactivation_mrr_minor) / (SELECT divisor FROM currency_units) AS reactivation_mrr,
          SUM(expansion_mrr_minor) / (SELECT divisor FROM currency_units) AS expansion_mrr,
          -SUM(contraction_mrr_minor) / (SELECT divisor FROM currency_units) AS contraction_mrr,
          -SUM(churned_mrr_minor) / (SELECT divisor FROM currency_units) AS churn_mrr
        FROM `chargebee_reports.monthly_mrr_movements`
        WHERE metric_month >= CAST('{{ filters.date_range.start }}' AS DATE)
          AND metric_month <= CAST('{{ filters.date_range.end }}' AS DATE)
          AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
        GROUP BY metric_month
      )
      SELECT metric_month, movement_category, movement_mrr
      FROM monthly,
      UNNEST([
        STRUCT('New business' AS movement_category, new_mrr AS movement_mrr),
        STRUCT('Reactivation', reactivation_mrr),
        STRUCT('Expansion', expansion_mrr),
        STRUCT('Contraction', contraction_mrr),
        STRUCT('Churn', churn_mrr)
      ])
      WHERE movement_mrr != 0
      ORDER BY metric_month, movement_category

  channel_mix:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      ), latest AS (
        SELECT MAX(metric_month) AS metric_month
        FROM `chargebee_reports.monthly_mrr_by_customer`
        WHERE metric_month >= CAST('{{ filters.date_range.start }}' AS DATE)
          AND metric_month <= CAST('{{ filters.date_range.end }}' AS DATE)
          AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
      )
      SELECT
        COALESCE(NULLIF(mrr.acquisition_channel, ''), 'Unknown') AS channel,
        COUNTIF(mrr.ending_mrr_minor > 0) AS active_customers,
        SUM(mrr.ending_mrr_minor) / (SELECT divisor FROM currency_units) AS ending_mrr
      FROM `chargebee_reports.monthly_mrr_by_customer` AS mrr, latest
      WHERE mrr.metric_month = latest.metric_month
        AND LOWER(mrr.currency_code) = LOWER('{{ filters.currency }}')
      GROUP BY 1
      HAVING ending_mrr > 0
      ORDER BY ending_mrr DESC

  portfolio_bands:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      ), latest AS (
        SELECT MAX(metric_month) AS metric_month
        FROM `chargebee_reports.monthly_mrr_by_customer`
        WHERE metric_month >= CAST('{{ filters.date_range.start }}' AS DATE)
          AND metric_month <= CAST('{{ filters.date_range.end }}' AS DATE)
          AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
      )
      SELECT
        CASE
          WHEN mrr.ending_mrr_minor < 25000 THEN 'Starter · under $250'
          WHEN mrr.ending_mrr_minor < 50000 THEN 'Core · $250–$499'
          WHEN mrr.ending_mrr_minor < 100000 THEN 'Growth · $500–$999'
          ELSE 'Scale · $1,000+'
        END AS customer_band,
        COUNT(*) AS active_customers,
        SUM(mrr.ending_mrr_minor) / (SELECT divisor FROM currency_units) AS ending_mrr
      FROM `chargebee_reports.monthly_mrr_by_customer` AS mrr, latest
      WHERE mrr.metric_month = latest.metric_month
        AND LOWER(mrr.currency_code) = LOWER('{{ filters.currency }}')
        AND mrr.ending_mrr_minor > 0
      GROUP BY 1
      ORDER BY MIN(ending_mrr_minor)

  concentration_summary:
    sql: |
      SELECT
        top_1_share,
        top_5_share,
        top_n_share AS top_10_share,
        active_customer_count
      FROM `chargebee_reports.revenue_concentration`
      WHERE LOWER(currency_code) = LOWER('{{ filters.currency }}')
        AND customer_rank = 1
      QUALIFY ROW_NUMBER() OVER (ORDER BY as_of_snapshot_date DESC) = 1

  billing_health:
    sql: |
      WITH currency_units AS (
        SELECT IF(UPPER('{{ filters.currency }}') IN (
          'BIF', 'CLP', 'DJF', 'GNF', 'JPY', 'KMF', 'KRW', 'MGA',
          'PYG', 'RWF', 'UGX', 'VND', 'VUV', 'XAF', 'XOF', 'XPF'
        ), 1, 100) AS divisor
      ), latest AS (
        SELECT MAX(invoice_billing_month) AS invoice_billing_month
        FROM `chargebee_reports.monthly_invoice_billings`
        WHERE invoice_billing_month >= CAST('{{ filters.date_range.start }}' AS DATE)
          AND invoice_billing_month <= CAST('{{ filters.date_range.end }}' AS DATE)
          AND LOWER(currency_code) = LOWER('{{ filters.currency }}')
      )
      SELECT
        SUM(billed_total_minor) / (SELECT divisor FROM currency_units) AS billed,
        SUM(collected_total_minor) / (SELECT divisor FROM currency_units) AS collected,
        SUM(outstanding_due_minor) / (SELECT divisor FROM currency_units) AS outstanding,
        SAFE_DIVIDE(SUM(collected_total_minor), NULLIF(SUM(billed_total_minor), 0)) AS collection_rate
      FROM `chargebee_reports.monthly_invoice_billings` AS billing, latest
      WHERE billing.invoice_billing_month = latest.invoice_billing_month
        AND LOWER(billing.currency_code) = LOWER('{{ filters.currency }}')

rows:
  - widgets:
      - name: Executive growth cockpit
        type: text
        content: |
          # Chargebee revenue command center

          The first question is simple: **is the business growing, and is that growth durable?** This view keeps committed recurring revenue separate from invoicing and cash. All money is shown in native `{{ filters.currency | upper }}`; no FX conversion is applied.

          Use the other tabs for retention cohorts, monetization, and the account-level collection queue.
        col: 12

  - widgets:
      - name: Ending MRR
        type: metric
        query: latest_kpis
        column: ending_mrr
        format: "$,.0f"
        col: 3
      - name: MRR growth vs prior month
        type: metric
        query: latest_kpis
        column: mrr_growth
        format: ".1%"
        col: 3
      - name: Run-rate ARR
        type: metric
        query: latest_kpis
        column: ending_arr
        format: "$,.0f"
        col: 3
      - name: Active logos
        type: metric
        query: latest_kpis
        column: active_customers
        format: ",.0f"
        col: 3

  - widgets:
      - name: Net Revenue Retention
        type: metric
        query: latest_kpis
        column: nrr
        format: ".1%"
        col: 3
      - name: Gross Revenue Retention
        type: metric
        query: latest_kpis
        column: grr
        format: ".1%"
        col: 3
      - name: SaaS quick ratio
        type: metric
        query: latest_kpis
        column: quick_ratio
        format: ".2f"
        col: 3
      - name: Latest collection rate
        type: metric
        query: billing_health
        column: collection_rate
        format: ".0%"
        col: 3

  - widgets:
      - name: MRR trajectory
        type: chart
        chart: area
        query: monthly_mrr
        x: metric_month
        y: [ending_mrr]
        col: 7
      - name: Where MRR moved this month
        type: chart
        chart: bar
        query: mrr_movement
        x: metric_month
        y: [movement_mrr]
        stacked: true
        col: 5

  - widgets:
      - name: Customer portfolio by MRR band
        type: chart
        chart: bar
        query: portfolio_bands
        x: customer_band
        y: [ending_mrr]
        col: 6
      - name: Active logos over time
        type: chart
        chart: line
        query: monthly_mrr
        x: metric_month
        y: [active_customers]
        col: 6

  - widgets:
      - name: Top-1 MRR share
        type: metric
        query: concentration_summary
        column: top_1_share
        format: ".1%"
        col: 3
      - name: Top-5 MRR share
        type: metric
        query: concentration_summary
        column: top_5_share
        format: ".1%"
        col: 3
      - name: Top-10 MRR share
        type: metric
        query: concentration_summary
        column: top_10_share
        format: ".1%"
        col: 3
      - name: ARPA
        type: metric
        query: latest_kpis
        column: arpa
        format: "$,.0f"
        col: 3

  - widgets:
      - name: What to do next
        type: text
        content: |
          **Read the story:** MRR and ARR show the size of the business; NRR and GRR show whether the installed base is durable; quick ratio shows whether positive movements are outpacing churn and contraction; collection rate flags cash leakage.

          **Important distinction:** invoice billings are not MRR, and open invoices are not confirmed involuntary churn. The Collections tab makes that payment-risk coverage explicit.
        col: 12
