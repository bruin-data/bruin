        query: payment_risk_summary
        value: { field: open_invoices, type: number, format: ",.0f" }
        col: 3
      - name: Overdue AR
        type: metric
        query: payment_risk_summary
        value: { field: overdue_ar, type: number, format: "$,.0f" }
        col: 3
      - name: Collection rate (%)
        type: metric
        query: latest_collections
        value: { field: collection_rate_pct, type: number, format: ",.1f" }
        col: 3

  - tab: Collections & Risk
    widgets:
      - name: Latest billed to cash conversion
        type: chart
        chart: pie
        query: cash_conversion_snapshot
        label: stage
        value: { field: amount }
        col: 12

  - tab: Collections & Risk
    widgets:
      - name: At-risk MRR by payment urgency
        type: chart
        chart: bar
        query: payment_risk_bands
        x: { field: urgency }
        y: { field: [mrr_exposed] }
        col: 6
      - name: Collections interpretation
        type: text
        content: |
          **Decision rule:** prioritize the urgency band with the most MRR exposed, then work down the account queue by MRR. The conversion donut separates cash already collected from the amount still exposed; a fully outstanding donut is a payment-flow alert, not a revenue trend.
        col: 6

