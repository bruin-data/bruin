name: config.redaction_request
type: duckdb.seed
description: |
  Deletion and redaction requests by source and external ID. Rows listed here
  are dropped from staging and everything downstream on the next run. To purge
  the raw record as well, follow docs/sources-and-privacy.md#deletion-and-redaction
  (scripts/redact.sh does both). Keep this file in version control so a
  re-collected record stays suppressed.
tags: [enrich, config, privacy]
parameters:
  path: ./redaction_requests.csv
columns:
  - name: source
    type: varchar
    checks:
      - name: not_null
  - name: external_id
    type: varchar
    checks:
      - name: not_null
  - name: requested_at
    type: varchar
  - name: reason
    type: varchar
