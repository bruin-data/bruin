name: stripe_raw.product
type: ingestr

description: >
  Raw-layer Stripe products loaded into BigQuery with ingestr's incremental
  Stripe mode. Each run fetches the products created inside its own time
  window and merges them into the destination table on `id`. Product edits
  made after creation are only picked up by a run whose window covers them, or
  by a wider backfill.

materialization:
  type: table
  strategy: merge
  incremental_key: created

parameters:
  source_table: product:sync:incremental
  enforce_schema: true

tags:
  - stripe_raw
  - stripe
  - billing

columns:
  - name: id
    type: varchar
    description: Stripe product identifier, for example `prod_NWjs8kKbJWmuuc`.
    primary_key: true
    checks:
      - name: not_null
      - name: unique
  - name: object
    type: varchar
    description: Stripe object type, always `product`.
  - name: created
    type: bigint
    description: Unix timestamp in seconds of when the product was created.
    checks:
      - name: not_null
  - name: updated
    type: bigint
    description: Unix timestamp in seconds of when the product was last updated.
  - name: name
    type: varchar
    description: Product name shown to customers on invoices and receipts.
  - name: description
    type: varchar
    description: Product description shown to customers.
  - name: active
    type: boolean
    description: Whether the product is currently available for purchase.
  - name: type
    type: varchar
    description: Product type, either `good` or `service`.
  - name: default_price
    type: varchar
    description: Identifier of the price Stripe uses by default for this product.
  - name: unit_label
    type: varchar
    description: Label describing a single unit of the product, for example `seat`.
  - name: statement_descriptor
    type: varchar
    description: Text shown on the customer's card statement.
  - name: tax_code
    type: varchar
    description: Identifier of the tax code assigned to the product.
  - name: images
    type: json
    description: URLs of images for the product.
  - name: marketing_features
    type: json
    description: Marketing feature bullets displayed for the product.
  - name: package_dimensions
    type: json
    description: Package dimensions used for shipping calculations.
  - name: shippable
    type: boolean
    description: Whether the product is a shipped physical good.
  - name: url
    type: varchar
    description: Public URL of a web page describing the product.
  - name: metadata
    type: json
    description: Key-value metadata set on the Stripe product.
  - name: livemode
    type: boolean
    description: Whether the object exists in Stripe live mode.
