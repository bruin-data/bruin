name: ashmont_case
schedule: daily
start_date: "2026-05-15"
catchup: false

default_connections:
  duckdb: "duckdb-default"

# Assets set their own materialization. A pipeline-level materialization default
# would be inherited by the teardown asset too, wrapping its DROP in a CREATE
# TABLE ... AS and failing the run.
default:
  type: duckdb.sql

variables:
  town_seed:
    type: integer
    default: 8317403
  ping_window_days:
    type: integer
    minimum: 7
    maximum: 28
    default: 28
