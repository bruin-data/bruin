version: "2"
run:
  allow-parallel-runners: true
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - goconst
    - gocritic
    - godot
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - grouper
    - iface
    - importas
    - inamedparam
    - intrange
    - ireturn
    - loggercheck
    - makezero
    - mirror
    - misspell
    - nakedret
    - nilerr
    - nilnesserr
    - noctx
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - zerologlint
  disable:
    - cyclop
    - depguard
    - dupl
    - err113
    - exhaustruct
    - forbidigo
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gocognit
    - gocyclo
    - godox
    - interfacebloat
    - lll
    - maintidx
    - mnd
    - musttag
    - nestif
    - nilnil
    - nlreturn
    - nolintlint
    - nonamedreturns
    - tagalign
    - tagliatelle
    - testpackage
    - thelper
    - tparallel
    - varnamelen
    - wrapcheck
    - wsl
  settings:
    gomoddirectives:
      # the root module consumes the in-repo semantic-engine module via a local replace
      replace-local: true
    goconst:
      min-len: 5
      min-occurrences: 5
    gosec:
      excludes:
        - G601
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - (or|er)$
        - bigquery.DB
        - snowflake.SfClient
        - postgres.PgClient
        - mssql.MsClient
        - databricks.Client
        - athena.Client
        - duckdb.DuckDBClient
        - clickhouse.ClickHouseClient
        - tea.Model
        - driver.Rows
        - driver.Row
        - driver.Batch
    exhaustive:
      default-signifies-exhaustive: true
    maintidx:
      under: 2
    nestif:
      min-complexity: 10
    revive:
      rules:
        - name: unexported-return
          disabled: true
    testifylint:
      enable:
        - bool-compare
        - compares
        - empty
        - error-is-as
        - error-nil
        - expected-actual
        - float-compare
        - len
        - suite-dont-use-pkg
        - suite-extra-assert-call
        - suite-thelper
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
        path: pkg/connection/connection.go
      - linters:
          - dupl
          - gosec
        path: (.+)_test.go
      # pkg/sqlengine is a line-by-line port of sqlglot, kept structurally close to the Python
      # source so that sqlglot upgrades can be ported by diffing the two side by side. Rewrites
      # these linters ask for (if/elif chains to switches, De Morgan, renaming `copy=` parameters,
      # changing signatures shared across dialects, errors.As instead of isinstance-style checks
      # on errors that are never wrapped) would break that correspondence.
      - linters:
          - dogsled
          - dupword
          - errname
          - errorlint
          - exhaustive
          - gochecknoinits
          - goconst
          - gocritic
          - ireturn
          - mirror
          - nakedret
          - prealloc
          - predeclared
          - recvcheck
          - unparam
          - wastedassign
        path: pkg/sqlengine/
      # Style suggestions, and code paths that mirror sqlglot's own (a loop that returns its first
      # item, an argument overwritten like the Python parameter, a value assigned and unused).
      - linters:
          - staticcheck
        path: pkg/sqlengine/
        text: "^(QF|ST|S1)|^SA400[469]"
      # Bounded narrowing conversions (positions, ASCII bytes, hash bytes) and guarded indexes.
      - linters:
          - gosec
        path: pkg/sqlengine/
        text: "^G(115|602)"
    paths:
      - vendor
      - .git
      - .idea
      - dist
      - .github
      - resources
      - bin
      - third_party$
      - builtin$
      - examples$
      - repro_adbc_list
formatters:
  enable:
    - gci
    - goimports
  exclusions:
    generated: lax
    paths:
      - vendor
      - .git
      - .idea
      - dist
      - .github
      - resources
      - bin
      - third_party$
      - builtin$
      - examples$
      - repro_adbc_list
