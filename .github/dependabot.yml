version: 2
updates:
  # Keep version-update PRs disabled; exclusions also constrain security updates.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    exclude-paths:
      - "pkg/python/testdata/mixed_deps/pyproject.toml"
      - "pkg/python/testdata/mixed_deps/requirements.txt"
      - "pkg/python/testdata/pipeline1/tasks/asset2/requirements.txt"
      - "pkg/python/testdata/pipeline1/tasks/asset3/requirements.txt"
      - "pkg/python/testdata/pyproject_locked/pyproject.toml"
      - "pkg/python/testdata/pyproject_locked/uv.lock"
      - "pkg/python/testdata/pyproject_nested/pyproject.toml"
      - "pkg/python/testdata/pyproject_no_lock/pyproject.toml"
      - "pkg/python/testdata/pyproject_python_version/pyproject.toml"
      - "pkg/python/testdata/reqfinder/dir1/dir2/dir3/requirements.txt"
      - "pkg/python/testdata/reqfinder/dir1/requirements.txt"
      - "cmd/testdata/lineage/assets/nested/requirements.txt"
      - "integration-tests/test-pipelines/happy-path/requirements.txt"
      - "integration-tests/test-pipelines/parse-default-option/requirements.txt"
      - "integration-tests/test-pipelines/parse-happy-path/requirements.txt"
      - "integration-tests/test-pipelines/parse-whole-pipeline/requirements.txt"
      - "integration-tests/test-pipelines/python-mat-merge/requirements.txt"
      - "integration-tests/test-pipelines/python-mat/requirements.txt"
      - "integration-tests/test-pipelines/python-pyproject-materialization/pyproject.toml"
      - "integration-tests/test-pipelines/python-pyproject-materialization/uv.lock"
      - "integration-tests/test-pipelines/python-pyproject/pyproject.toml"
      - "integration-tests/test-pipelines/python-pyproject/uv.lock"
      - "integration-tests/test-pipelines/python-pyproject/assets/nested/pyproject.toml"
      - "integration-tests/test-pipelines/python-pyproject/assets/nested/uv.lock"
      - "examples/simple-pipeline/assets/nested/requirements.txt"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    exclude-paths:
      - "integration-tests/cloud-integration-tests/clickhouse/go.mod"
      - "integration-tests/cloud-integration-tests/doris/go.mod"
      - "integration-tests/cloud-integration-tests/sail/go.mod"
      - "integration-tests/cloud-integration-tests/spark/go.mod"
      - "integration-tests/cloud-integration-tests/starrocks/go.mod"
