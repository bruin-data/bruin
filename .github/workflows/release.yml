name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bruin-data/bruin

jobs:
  integration-tests:
    strategy:
      matrix:
        platform: [ depot-ubuntu-latest-4, depot-macos-15, depot-windows-latest-4 ]
        suite: ["test-full", "integration-test"]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install R in background (Ubuntu)
        if: matrix.suite == 'integration-test' && startsWith(matrix.platform, 'depot-ubuntu')
        run: |
          nohup bash -c 'sudo apt-get install -y --no-install-recommends r-base-core 2>/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base-core)' > /tmp/r_install.log 2>&1 &
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"
      - name: Cache Rust artifacts
        id: rust-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pkg/sqlparser/rustffi/target
          key: rust-${{ runner.os }}-${{ hashFiles('pkg/sqlparser/rustffi/Cargo.lock', 'pkg/sqlparser/rustffi/Cargo.toml', 'pkg/sqlparser/rustffi/src/**/*.rs') }}
          restore-keys: |
            rust-${{ runner.os }}-
      - name: Touch cached Rust lib
        if: steps.rust-cache.outputs.cache-hit == 'true'
        shell: bash
        run: touch pkg/sqlparser/rustffi/target/release/libbruin_rustsqlparser.a
      - name: Setup Rust
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Wait for R (Ubuntu)
        if: matrix.suite == 'integration-test' && startsWith(matrix.platform, 'depot-ubuntu')
        run: |
          # Budgeted on wall clock rather than loop iterations, and generously:
          # the background apt-get fetches 30 MB, and a slow archive mirror had
          # been overrunning the old 120-iteration budget. The loop still exits
          # the moment Rscript appears, so a healthy run pays nothing for this.
          deadline=$((SECONDS + 600))
          until command -v Rscript >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::R did not become available within 600s. Install log:"
              cat /tmp/r_install.log 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          echo "R available after ${SECONDS}s"
      - name: Install R (macOS)
        if: matrix.suite == 'integration-test' && startsWith(matrix.platform, 'depot-macos')
        run: |
          brew install r
      - name: Install R (Windows)
        if: matrix.suite == 'integration-test' && startsWith(matrix.platform, 'depot-windows')
        shell: bash
        run: |
          choco install r.project -y
      - name: Run test suite
        shell: bash
        run: |
          [[ "${{runner.os}}" != 'Windows' ]] || export PATH="/c/mingw64/bin:$PATH"
          make ${{ matrix.suite }}

  cloud-integration-tests:
    name: Cloud Integration Tests (BigQuery)
    runs-on: depot-ubuntu-latest-4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"
      - name: Cache Rust artifacts
        id: rust-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pkg/sqlparser/rustffi/target
          key: rust-${{ runner.os }}-${{ hashFiles('pkg/sqlparser/rustffi/Cargo.lock', 'pkg/sqlparser/rustffi/Cargo.toml', 'pkg/sqlparser/rustffi/src/**/*.rs') }}
          restore-keys: |
            rust-${{ runner.os }}-
      - name: Touch cached Rust lib
        if: steps.rust-cache.outputs.cache-hit == 'true'
        run: touch pkg/sqlparser/rustffi/target/release/libbruin_rustsqlparser.a
      - name: Setup Rust
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Build Bruin
        run: make build

      - name: Create cloud config file
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          cat > integration-tests/cloud-integration-tests/.bruin.cloud.yml << EOF
          default_environment: default
          environments:
            default:
              connections:
                google_cloud_platform:
                  - name: gcp-default
                    project_id: "${GCP_PROJECT_ID}"
                    service_account_json: '${GCP_SERVICE_ACCOUNT_JSON}'
          EOF

      - name: Test BigQuery connection (fail fast)
        run: |
          ./bin/bruin connections test \
            --config-file integration-tests/cloud-integration-tests/.bruin.cloud.yml \
            --env default \
            --name gcp-default

      - name: Run BigQuery Integration Tests
        run: |
          cd integration-tests/cloud-integration-tests/bigquery
          go test -v -timeout 30m ./...

  prepare-darwin:
    runs-on: depot-ubuntu-latest-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"
      - shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: cache darwin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/darwin
          key: darwin-${{ env.sha_short }}
      - name: Run GoReleaser
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --privileged   -v /var/run/docker.sock:/var/run/docker.sock -e GGOOS=darwin -e GORELEASER_KEY=${{ secrets.GORELEASER_KEY }} -e COMMIT_SHA=${{ github.sha }} -e VERSION=${{ github.ref_name }} -e GITHUB_TOKEN=${{ secrets.RELEASE_TOKEN }} -e TELEMETRY_KEY=${{ secrets.TELEMETRY_KEY }} -v $(pwd):/src -w /src goreleaser/goreleaser-cross-pro:v1.23 release --clean --split --verbose


  prepare-linux:
    runs-on: depot-ubuntu-latest-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"
      - shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: cache linux
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/linux
          key: linux-${{ env.sha_short }}
      - name: Run GoReleaser
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --privileged   -v /var/run/docker.sock:/var/run/docker.sock -e GGOOS=linux -e GORELEASER_KEY=${{ secrets.GORELEASER_KEY }} -e COMMIT_SHA=${{ github.sha }} -e VERSION=${{ github.ref_name }} -e GITHUB_TOKEN=${{ secrets.RELEASE_TOKEN }} -e TELEMETRY_KEY=${{ secrets.TELEMETRY_KEY }} -v $(pwd):/src -w /src goreleaser/goreleaser-cross-pro:v1.23 release --clean --split --verbose


  release-unix:
    runs-on: depot-ubuntu-latest
    needs: [prepare-linux, prepare-darwin, integration-tests]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/linux
          key: linux-${{ env.sha_short }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/darwin
          key: darwin-${{ env.sha_short }}
      - uses: goreleaser/goreleaser-action@b508e2e3ef3b19d4e4146d4f8fb3ba9db644a757 # v3
        with:
          distribution: goreleaser-pro
          version: v2.3.2
          args: continue --merge
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}

  release-windows:
    runs-on: depot-windows-latest
    needs: [prepare-linux, prepare-darwin, integration-tests]
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-libs
            mingw-w64-ucrt-x86_64-winpthreads

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"

      - name: Release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.3.2
          distribution: goreleaser-pro
          args: release --clean --split
        env:
          # existing env
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          VERSION: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
          GGOOS: windows

          # ✅ make Windows CGO use MinGW-UCRT and link runtime statically
          CGO_ENABLED: 1
          CC: x86_64-w64-mingw32-gcc
          CGO_LDFLAGS: "-static-libgcc -static-libstdc++ -Wl,-Bstatic -lwinpthread -Wl,-Bdynamic"

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/windows/bruin_Windows_x86_64.zip
          asset_name: bruin_Windows_x86_64.zip
          tag: ${{ github.ref }}
          overwrite: false
          make_latest: false
          prerelease: false

  dockerBuild:
    runs-on: depot-ubuntu-latest
    name: Docker Build
    permissions:
      # allow issuing OIDC tokens for this workflow run
      id-token: write
      # allow at least reading the repo contents, add other permissions if necessary
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: bruin-data
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Depot
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1

      - name: Build and push Docker image
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BRANCH_NAME=${{ github.ref_name }}

  dockerTest:
    runs-on: depot-ubuntu-latest
    name: Test Docker Image
    needs: [dockerBuild]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: bruin-data
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the built Docker image
        run: |
          echo "Pulling image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Test Python pipeline initialization
        run: |
          echo "Creating test directory..."
          mkdir -p /tmp/docker-test
          chmod 777 /tmp/docker-test

          echo "Initializing Python pipeline..."
          docker run --rm \
            -v /tmp/docker-test:/tmp/docker-test \
            -w /tmp/docker-test \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            bruin init python --in-place python-pipeline

          echo "Verifying Python pipeline was created..."
          ls -la /tmp/docker-test/python-pipeline

      - name: Test running Python pipeline
        run: |
          echo "Running Python pipeline..."
          docker run --rm \
            -v /tmp/docker-test:/tmp/docker-test \
            -w /tmp/docker-test/python-pipeline \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            bruin run .

      - name: Test DuckDB pipeline initialization
        run: |
          echo "Initializing DuckDB pipeline..."
          chmod 777 /tmp/docker-test
          docker run --rm \
            -v /tmp/docker-test:/tmp/docker-test \
            -w /tmp/docker-test \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            bruin init duckdb --in-place duckdb-pipeline

          echo "Verifying DuckDB pipeline was created..."
          ls -la /tmp/docker-test/duckdb-pipeline

      - name: Test running DuckDB pipeline
        run: |
          echo "Running DuckDB pipeline..."
          docker run --rm \
            -v /tmp/docker-test:/tmp/docker-test \
            -w /tmp/docker-test/duckdb-pipeline \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            bruin run .

      - name: Cleanup test files
        if: always()
        run: |
          # The image runs as user `bruin` and may create root-owned or non-runner-owned files
          # in the bind mount; cleanup via a root container avoids permission issues.
          docker run --rm --user root \
            -v /tmp/docker-test:/tmp/docker-test \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            sh -c 'find /tmp/docker-test -mindepth 1 -delete'
          rm -rf /tmp/docker-test

  install-windows:
    runs-on: depot-windows-latest
    name: Installer Script on Windows
    needs: [release-windows, release-unix]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Show directories
        shell: bash
        run: pwd && cd && pwd
      - name: Use install script
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=3
          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Installer script test attempt ${attempt}/${max_attempts} (Windows)"
            rm -rf test-pipeline
            if curl -LsSf https://getbruin.com/install/cli | sh -s -- -d "${GITHUB_REF##*/}" \
              && ~/.local/bin/bruin.exe init chess test-pipeline \
              && (cd test-pipeline && ~/.local/bin/bruin.exe run .); then
              exit 0
            fi

            if [ "${attempt}" -lt "${max_attempts}" ]; then
              backoff_seconds=$((attempt * 15))
              echo "Attempt ${attempt} failed, retrying in ${backoff_seconds}s..."
              sleep "${backoff_seconds}"
            fi
          done

          echo "Installer script tests failed after ${max_attempts} attempts on Windows." >&2
          exit 1

  install-unix:
    runs-on: ubuntu-latest
    name: Installer Script on Linux
    needs: [release-windows, release-unix]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Extract tag from ref
        id: extract_tag
        run: |
          ref_name="${GITHUB_REF##*/}"
          echo "tag=${ref_name}" >> $GITHUB_ENV
      - name: Use install script
        run: |
          set -euo pipefail
          max_attempts=3
          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Installer script test attempt ${attempt}/${max_attempts} (Linux)"
            rm -rf test-pipeline
            if curl -LsSf https://getbruin.com/install/cli | sh -s -- -d "${{ env.tag }}" \
              && bruin init chess test-pipeline \
              && (cd test-pipeline && bruin run .); then
              exit 0
            fi

            if [ "${attempt}" -lt "${max_attempts}" ]; then
              backoff_seconds=$((attempt * 15))
              echo "Attempt ${attempt} failed, retrying in ${backoff_seconds}s..."
              sleep "${backoff_seconds}"
            fi
          done

          echo "Installer script tests failed after ${max_attempts} attempts on Linux." >&2
          exit 1

  release:
    runs-on: ubuntu-latest
    needs: [install-unix, install-windows]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Extract tag from ref
        id: extract_tag
        run: |
          ref_name="${GITHUB_REF##*/}"
          echo "tag=${ref_name}" >> $GITHUB_ENV
      - name: Release promote to latest
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.tag }}
          prerelease: false
          make_latest: true
          clear_attachments: false
