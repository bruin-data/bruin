name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  INGESTR_HASHES_PREVERIFIED: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: bruin-data/bruin

jobs:
  verify-ingestr:
    # Use GitHub's maintained runner image for trusted gh provisioning.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Authenticate pinned ingestr and generate embedded hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_ingestr_hashes.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ingestr-hashes
          path: pkg/python/ingestr_hashes.json
          if-no-files-found: error
          retention-days: 1

  integration-tests:
    needs: [verify-ingestr]
    strategy:
      matrix:
        platform: [ blacksmith-4vcpu-ubuntu-2404, depot-macos-15, blacksmith-4vcpu-windows-2025 ]
        suite: ["test-full", "integration-test"]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install R in background (Ubuntu)
        if: matrix.suite == 'integration-test' && runner.os == 'Linux'
        run: |
          nohup bash -c 'sudo apt-get install -y --no-install-recommends r-base-core 2>/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base-core)' > /tmp/r_install.log 2>&1 &
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ingestr-hashes
          path: pkg/python
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"
          # Blacksmith's Linux runners cache Go builds through GOCACHEPROG.
          cache: ${{ runner.os != 'Linux' }}
      - name: Wait for R (Ubuntu)
        if: matrix.suite == 'integration-test' && runner.os == 'Linux'
        run: |
          # Budgeted on wall clock rather than loop iterations, and generously:
          # the background apt-get fetches 30 MB, and a slow archive mirror had
          # been overrunning the old 120-iteration budget. The loop still exits
          # the moment Rscript appears, so a healthy run pays nothing for this.
          deadline=$((SECONDS + 600))
          until command -v Rscript >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::R did not become available within 600s. Install log:"
              cat /tmp/r_install.log 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          echo "R available after ${SECONDS}s"
      - name: Install R (macOS)
        if: matrix.suite == 'integration-test' && runner.os == 'macOS'
        run: |
          brew install r
      - name: Install R (Windows)
        if: matrix.suite == 'integration-test' && runner.os == 'Windows'
        shell: bash
        run: |
          choco install r.project -y
      - name: Run test suite
        shell: bash
        run: |
          [[ "${{runner.os}}" != 'Windows' ]] || export PATH="/c/mingw64/bin:$PATH"
          make ${{ matrix.suite }}

  cloud-integration-tests:
    name: Cloud Integration Tests (BigQuery)
    needs: [verify-ingestr]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ingestr-hashes
          path: pkg/python

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          # Blacksmith caches Go builds through GOCACHEPROG.
          cache: false
      - name: Build Bruin
        run: make build

      - name: Create cloud config file
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          cat > integration-tests/cloud-integration-tests/.bruin.cloud.yml << EOF
          default_environment: default
          environments:
            default:
              connections:
                google_cloud_platform:
                  - name: gcp-default
                    project_id: "${GCP_PROJECT_ID}"
                    service_account_json: '${GCP_SERVICE_ACCOUNT_JSON}'
          EOF

      - name: Test BigQuery connection (fail fast)
        run: |
          ./bin/bruin connections test \
            --config-file integration-tests/cloud-integration-tests/.bruin.cloud.yml \
            --env default \
            --name gcp-default

      - name: Run BigQuery Integration Tests
        run: |
          cd integration-tests/cloud-integration-tests/bigquery
          go test -v -timeout 30m ./...

  prepare-darwin:
    needs: [verify-ingestr]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ingestr-hashes
          path: pkg/python
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          # Blacksmith caches Go builds through GOCACHEPROG.
          cache: false
      - shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: cache darwin
        uses: actions/cache@v6.1.0
        with:
          path: dist/darwin
          key: darwin-${{ env.sha_short }}
      - name: Run GoReleaser
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --privileged   -v /var/run/docker.sock:/var/run/docker.sock -e GGOOS=darwin -e GORELEASER_KEY=${{ secrets.GORELEASER_KEY }} -e COMMIT_SHA=${{ github.sha }} -e VERSION=${{ github.ref_name }} -e GITHUB_TOKEN=${{ secrets.RELEASE_TOKEN }} -e TELEMETRY_KEY=${{ secrets.TELEMETRY_KEY }} -v $(pwd):/src -w /src goreleaser/goreleaser-cross-pro:v1.23 release --clean --split --verbose


  prepare-linux:
    needs: [verify-ingestr]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ingestr-hashes
          path: pkg/python
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          # Blacksmith caches Go builds through GOCACHEPROG.
          cache: false
      - shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: cache linux
        uses: actions/cache@v6.1.0
        with:
          path: dist/linux
          key: linux-${{ env.sha_short }}
      - name: Run GoReleaser
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --privileged   -v /var/run/docker.sock:/var/run/docker.sock -e GGOOS=linux -e GORELEASER_KEY=${{ secrets.GORELEASER_KEY }} -e COMMIT_SHA=${{ github.sha }} -e VERSION=${{ github.ref_name }} -e GITHUB_TOKEN=${{ secrets.RELEASE_TOKEN }} -e TELEMETRY_KEY=${{ secrets.TELEMETRY_KEY }} -v $(pwd):/src -w /src goreleaser/goreleaser-cross-pro:v1.23 release --clean --split --verbose


  release-unix:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [prepare-linux, prepare-darwin, integration-tests]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - uses: actions/cache@v6.1.0
        with:
          path: dist/linux
          key: linux-${{ env.sha_short }}
      - uses: actions/cache@v6.1.0
        with:
          path: dist/darwin
          key: darwin-${{ env.sha_short }}
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser-pro
          version: v2.3.2
          args: continue --merge
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}

  release-windows:
    # 4 vCPU: the 2 vCPU Blacksmith runner compiled the CGO build noticeably slower.
    runs-on: blacksmith-4vcpu-windows-2025
    needs: [prepare-linux, prepare-darwin, integration-tests]
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ingestr-hashes
          path: pkg/python

      - uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-libs
            mingw-w64-ucrt-x86_64-winpthreads

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"

      - name: Release
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.3.2
          distribution: goreleaser-pro
          args: release --clean --split
        env:
          # existing env
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          VERSION: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
          GGOOS: windows

          # ✅ make Windows CGO use MinGW-UCRT and link runtime statically
          CGO_ENABLED: 1
          CC: x86_64-w64-mingw32-gcc
          CGO_LDFLAGS: "-static-libgcc -static-libstdc++ -Wl,-Bstatic -lwinpthread -Wl,-Bdynamic"

      - name: Upload binaries to release
        # Use the host shell/PATH, not the job's MSYS2 shell, for GitHub CLI.
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Windows can finish before the Unix job creates the release.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false \
              --title "$GITHUB_REF_NAME" --notes "" || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          # Deliberately omit --clobber: an existing asset must not be replaced.
          gh release upload "$GITHUB_REF_NAME" dist/windows/bruin_Windows_x86_64.zip

  dockerBuild:
    needs: [verify-ingestr]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    name: Docker Build
    permissions:
      # allow issuing OIDC tokens for this workflow run
      id-token: write
      # allow at least reading the repo contents, add other permissions if necessary
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ingestr-hashes
          path: pkg/python

      - name: Log in to the Container registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: bruin-data
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Depot
        uses: depot/setup-action@v1.7.2

      - name: Build and push Docker image
        uses: depot/build-push-action@v1.19.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BRANCH_NAME=${{ github.ref_name }}

  dockerTest:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    name: Test Docker Image
    needs: [dockerBuild]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: bruin-data
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the built Docker image
        run: |
          echo "Pulling image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Test Python pipeline initialization
        run: |
          echo "Creating test directory..."
          mkdir -p /tmp/docker-test
          chmod 777 /tmp/docker-test

          echo "Initializing Python pipeline..."
          docker run --rm \
            -v /tmp/docker-test:/tmp/docker-test \
            -w /tmp/docker-test \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            bruin init python --in-place python-pipeline

          echo "Verifying Python pipeline was created..."
          ls -la /tmp/docker-test/python-pipeline

      - name: Test running Python pipeline
        run: |
          echo "Running Python pipeline..."
          docker run --rm \
            -v /tmp/docker-test:/tmp/docker-test \
            -w /tmp/docker-test/python-pipeline \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            bruin run .

      - name: Test DuckDB pipeline initialization
        run: |
          echo "Initializing DuckDB pipeline..."
          chmod 777 /tmp/docker-test
          docker run --rm \
            -v /tmp/docker-test:/tmp/docker-test \
            -w /tmp/docker-test \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            bruin init duckdb --in-place duckdb-pipeline

          echo "Verifying DuckDB pipeline was created..."
          ls -la /tmp/docker-test/duckdb-pipeline

      - name: Test running DuckDB pipeline
        run: |
          echo "Running DuckDB pipeline..."
          docker run --rm \
            -v /tmp/docker-test:/tmp/docker-test \
            -w /tmp/docker-test/duckdb-pipeline \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            bruin run .

      - name: Cleanup test files
        if: always()
        run: |
          # The image runs as user `bruin` and may create root-owned or non-runner-owned files
          # in the bind mount; cleanup via a root container avoids permission issues.
          docker run --rm --user root \
            -v /tmp/docker-test:/tmp/docker-test \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            sh -c 'find /tmp/docker-test -mindepth 1 -delete'
          rm -rf /tmp/docker-test

  install-windows:
    runs-on: blacksmith-2vcpu-windows-2025
    name: Installer Script on Windows
    needs: [release-windows, release-unix]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Show directories
        shell: bash
        run: pwd && cd && pwd
      - name: Use install script
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=3
          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Installer script test attempt ${attempt}/${max_attempts} (Windows)"
            rm -rf test-pipeline
            if curl -LsSf https://getbruin.com/install/cli | sh -s -- -d "${GITHUB_REF##*/}" \
              && ~/.local/bin/bruin.exe init chess test-pipeline \
              && (cd test-pipeline && ~/.local/bin/bruin.exe run .); then
              exit 0
            fi

            if [ "${attempt}" -lt "${max_attempts}" ]; then
              backoff_seconds=$((attempt * 15))
              echo "Attempt ${attempt} failed, retrying in ${backoff_seconds}s..."
              sleep "${backoff_seconds}"
            fi
          done

          echo "Installer script tests failed after ${max_attempts} attempts on Windows." >&2
          exit 1

  install-unix:
    runs-on: ubuntu-latest
    name: Installer Script on Linux
    needs: [release-windows, release-unix]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Extract tag from ref
        id: extract_tag
        run: |
          ref_name="${GITHUB_REF##*/}"
          echo "tag=${ref_name}" >> $GITHUB_ENV
      - name: Use install script
        run: |
          set -euo pipefail
          max_attempts=3
          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Installer script test attempt ${attempt}/${max_attempts} (Linux)"
            rm -rf test-pipeline
            if curl -LsSf https://getbruin.com/install/cli | sh -s -- -d "${{ env.tag }}" \
              && bruin init chess test-pipeline \
              && (cd test-pipeline && bruin run .); then
              exit 0
            fi

            if [ "${attempt}" -lt "${max_attempts}" ]; then
              backoff_seconds=$((attempt * 15))
              echo "Attempt ${attempt} failed, retrying in ${backoff_seconds}s..."
              sleep "${backoff_seconds}"
            fi
          done

          echo "Installer script tests failed after ${max_attempts} attempts on Linux." >&2
          exit 1

  release:
    runs-on: ubuntu-latest
    needs: [install-unix, install-windows]
    steps:
      - name: Release promote to latest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest
