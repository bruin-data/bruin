name: Docs Build

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build.yml'
      - '.github/workflows/deploy-docs.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'lychee.toml'
      - 'scripts/check_docs_links.sh'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build.yml'
      - '.github/workflows/deploy-docs.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'lychee.toml'
      - 'scripts/check_docs_links.sh'

jobs:
  docs-build:
    name: Build Documentation
    runs-on: depot-ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # VitePress lastUpdated is disabled; pages and sitemap need no history.
          fetch-depth: 1


      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Install dependencies with npm@11 (for min-release-age support)
        run: npx npm@11.10.0 ci


      - name: Build documentation
        run: npm run docs:build


      - name: Verify documentation output
        run: |
          if [ ! -d "./docs/.vitepress/dist" ]; then
            echo "Docs build failed: Output directory not found!"
            exit 1
          fi


      - name: Install lychee
        env:
          LYCHEE_VERSION: '0.24.2'
          LYCHEE_SHA256: '1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a'
        run: |
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${archive}"
          echo "${LYCHEE_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" --strip-components=1
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"


      - name: Check internal links and anchors
        run: scripts/check_docs_links.sh
