name: Docs Build

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build.yml'
      - '.github/workflows/deploy-docs.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'lychee.toml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build.yml'
      - '.github/workflows/deploy-docs.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'lychee.toml'

jobs:
  docs-build:
    name: Build Documentation
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # VitePress lastUpdated is disabled; pages and sitemap need no history.
          fetch-depth: 1


      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Install dependencies with npm@11 (for min-release-age support)
        run: npx npm@11.10.0 ci


      - name: Build documentation
        run: npm run docs:build


      - name: Verify documentation output
        run: |
          if [ ! -d "./docs/.vitepress/dist" ]; then
            echo "Docs build failed: Output directory not found!"
            exit 1
          fi


      - name: Stage site under /bruin/
        run: |
          mkdir -p "${RUNNER_TEMP}/site"
          cp -R docs/.vitepress/dist "${RUNNER_TEMP}/site/bruin"


      - name: Install Lychee
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/lychee"
          gh release download lychee-v0.24.2 --repo lycheeverse/lychee \
            --pattern "lychee-$(uname -m)-unknown-linux-gnu.tar.gz" \
            --dir "${RUNNER_TEMP}/lychee"
          tar -xzf "${RUNNER_TEMP}/lychee/lychee-$(uname -m)-unknown-linux-gnu.tar.gz" \
            --strip-components=1 -C "${RUNNER_TEMP}/lychee"

      # Same flags as scripts/check_docs_links.sh; keep them in sync.
      - name: Check internal links and anchors
        run: |
          "${RUNNER_TEMP}/lychee/lychee" \
            --config lychee.toml --offline --include-fragments \
            --fallback-extensions html --index-files index.html \
            --root-dir "${RUNNER_TEMP}/site" \
            '${{ runner.temp }}/site/bruin/**/*.html'
