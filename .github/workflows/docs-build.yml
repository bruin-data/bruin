name: Docs Build

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build.yml'
      - '.github/workflows/deploy-docs.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build.yml'
      - '.github/workflows/deploy-docs.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'

jobs:
  docs-build:
    name: Build Documentation
    runs-on: depot-ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # VitePress lastUpdated is disabled; pages and sitemap need no history.
          fetch-depth: 1


      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Install dependencies with npm@11 (for min-release-age support)
        run: npx npm@11.10.0 ci


      - name: Build documentation
        run: npm run docs:build


      - name: Verify documentation output
        run: |
          if [ ! -d "./docs/.vitepress/dist" ]; then
            echo "Docs build failed: Output directory not found!"
            exit 1
          fi
