name: Docs External Links

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  external-links:
    name: Check external links
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1


      # Same flags as scripts/check_docs_links.sh --external; keep them in sync.
      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: false
          output: lychee-report.md
          args: >-
            --config lychee.toml --scheme https --scheme http
            --root-dir ${{ github.workspace }}/docs
            '*.md' 'docs/**/*.md' 'templates/**/*.md'


      # Lychee 0.24.2 does not retry rejected HTTP 5xx responses.
      - name: Retry failed external link check
        id: retry
        if: steps.lychee.outputs.exit_code != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 30
          if scripts/check_docs_links.sh --external --format markdown --output lychee-report.md \
            --exclude-path lychee-report.md; then
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          fi


      - name: Open or update the broken links issue
        if: steps.retry.outputs.exit_code != '' && steps.retry.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Broken external links in docs'
        run: |
          {
            echo "The weekly [external link check](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) found broken links."
            echo "Fix the link, or add a pattern to \`lychee.toml\` if the URL is a placeholder or blocks automated checkers."
            echo
            if [ -s lychee-report.md ]; then
              head -c 60000 lychee-report.md
            else
              echo "lychee did not produce a report; see the run logs."
            fi
          } > issue.md
          number=$(gh issue list --state open --author app/github-actions --search "in:title \"${TITLE}\"" \
            --json number,title --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -n "${number}" ]; then
            gh issue edit "${number}" --body-file issue.md
          else
            gh issue create --title "${TITLE}" --body-file issue.md
          fi


      - name: Close the broken links issue
        if: steps.lychee.outputs.exit_code == '0' || steps.retry.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Broken external links in docs'
        run: |
          number=$(gh issue list --state open --author app/github-actions --search "in:title \"${TITLE}\"" \
            --json number,title --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -n "${number}" ]; then
            gh issue close "${number}" --comment "All external links pass as of ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi
