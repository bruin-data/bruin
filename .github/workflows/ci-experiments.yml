# Temporary: compares runner sizes and cache setups on Blacksmith. Not for merge.
name: CI Experiments
on:
  pull_request:
env:
  INGESTR_HASHES_PREVERIFIED: 1
jobs:
  verify-ingestr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Authenticate pinned ingestr and generate embedded hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_ingestr_hashes.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ingestr-hashes
          path: pkg/python/ingestr_hashes.json
          retention-days: 1

  test:
    needs: [verify-ingestr]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ingestr-hashes
          path: pkg/python
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Run full test suite
        run: make test-full

  end2end:
    needs: [verify-ingestr]
    strategy:
      fail-fast: false
      matrix:
        runner: [blacksmith-2vcpu-ubuntu-2404, blacksmith-4vcpu-ubuntu-2404]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install R (background)
        run: |
          nohup bash -c 'sudo apt-get install -y --no-install-recommends r-base-core 2>/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base-core)' > /tmp/r_install.log 2>&1 &
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ingestr-hashes
          path: pkg/python
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Wait for R
        run: |
          deadline=$((SECONDS + 600))
          until command -v Rscript >/dev/null 2>&1; do
            [ "$SECONDS" -lt "$deadline" ] || { cat /tmp/r_install.log; exit 1; }
            sleep 2
          done
      - name: Run integration tests
        run: make integration-test
      - name: Run MSSQL developer environment integration test
        run: make integration-test-mssql

  lint:
    needs: [verify-ingestr]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ingestr-hashes
          path: pkg/python
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Cache golangci-lint analysis
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/golangci-lint
          key: exp2-golangci-lint-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            exp2-golangci-lint-${{ hashFiles('go.sum') }}-
      - name: Install linting tools
        run: make setup
      - name: Check formatting
        run: make format-ci
      - name: Run full lint suite
        run: make lint-full
