# CI Checks workflow

name: CI Checks
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'resources/**'
      - 'templates/**'
      - 'install.sh'
      - 'README.md'
      - 'Makefile'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'resources/**'
      - 'templates/**'
      - 'install.sh'
      - 'README.md'
      - 'Makefile'
      - 'package.json'
      - 'package-lock.json'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: true
env:
  DOCKER_BUILDKIT: 1
  INGESTR_HASHES_PREVERIFIED: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: bruin-data/bruin
jobs:
  verify-ingestr:
    # Generate one authenticated manifest on GitHub's maintained image, then
    # use those exact bytes in every platform and Docker test below.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test authenticated hash generation
        run: python3 -m unittest discover -s scripts -p 'test_generate_ingestr_hashes.py'
      - name: Authenticate pinned ingestr and generate embedded hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_ingestr_hashes.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ingestr-hashes
          path: pkg/python/ingestr_hashes.json
          if-no-files-found: error
          retention-days: 1

  test:
    needs: [verify-ingestr]
    strategy:
      matrix:
        platform: [blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-windows-2025]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ingestr-hashes
          path: pkg/python
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"
          # Blacksmith's Linux runners cache Go builds through GOCACHEPROG;
          # Windows runners have no such cache and still need setup-go's.
          cache: ${{ runner.os == 'Windows' }}
      - name: Run full test suite
        shell: bash
        run: |
          # Race-enabled Windows binaries need the matching MinGW runtime DLLs.
          # Installer tests inject a missing shell, so the native fallback is
          # still covered without depending on this PATH.
          [[ "${{ runner.os }}" != 'Windows' ]] || export PATH="/c/mingw64/bin:$PATH"
          make test-full
  end2end:
    needs: [verify-ingestr]
    strategy:
      matrix:
        platform: [blacksmith-4vcpu-ubuntu-2404]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install R (background)
        run: |
          nohup bash -c 'sudo apt-get install -y --no-install-recommends r-base-core 2>/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base-core)' > /tmp/r_install.log 2>&1 &
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ingestr-hashes
          path: pkg/python
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          # Blacksmith caches Go builds through GOCACHEPROG.
          cache: false
      - name: Wait for R
        run: |
          # Budgeted on wall clock rather than loop iterations, and generously:
          # the background apt-get fetches 30 MB, and a slow archive mirror had
          # been overrunning the old 120-iteration budget. The loop still exits
          # the moment Rscript appears, so a healthy run pays nothing for this.
          deadline=$((SECONDS + 600))
          until command -v Rscript >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::R did not become available within 600s. Install log:"
              cat /tmp/r_install.log 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          echo "R available after ${SECONDS}s"
      - name: Run integration tests
        run: make integration-test
      - name: Run MSSQL developer environment integration test
        run: make integration-test-mssql
      - name: Run PostgreSQL CDC integration tests
        run: make integration-test-postgres-cdc
  dockerBuild:
    # Depot build for pushes and internally-created PRs. Fork PRs cannot
    # authenticate with Depot, so they are handled by dockerBuildFork instead.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [verify-ingestr]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    name: Docker Build
    permissions:
      # allow issuing OIDC tokens for this workflow run
      id-token: write
      # allow at least reading the repo contents, add other permissions if necessary
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ingestr-hashes
          path: pkg/python
      - name: Log in to the Container registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: bruin-data
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Set up Depot
        uses: depot/setup-action@v1.7.2
      - name: Build Docker image
        uses: depot/build-push-action@v1.19.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
            BRANCH_NAME=${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  dockerBuildFork:
    # GitHub-native build for PRs opened from forks, which cannot use Depot.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    needs: [verify-ingestr]
    runs-on: ubuntu-latest
    # Same check name as the Depot job so a required "Docker Build" status check
    # is satisfied whichever path runs (the other is skipped, which passes).
    name: Docker Build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ingestr-hashes
          path: pkg/python
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.head_ref }}
            BRANCH_NAME=${{ github.head_ref }}
  lint:
    needs: [verify-ingestr]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ingestr-hashes
          path: pkg/python
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          # Blacksmith caches Go builds through GOCACHEPROG.
          cache: false
      - name: Cache golangci-lint analysis
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - name: Install linting tools
        run: make setup
      - name: Check formatting
        run: make format-ci
      - name: Run full lint suite
        run: make lint-full
