# CI Checks workflow

name: CI Checks
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'resources/**'
      - 'templates/**'
      - 'install.sh'
      - 'README.md'
      - 'Makefile'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'resources/**'
      - 'templates/**'
      - 'install.sh'
      - 'README.md'
      - 'Makefile'
      - 'package.json'
      - 'package-lock.json'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: true
env:
  DOCKER_BUILDKIT: 1
  INGESTR_HASHES_PREVERIFIED: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: bruin-data/bruin
jobs:
  verify-ingestr:
    # Generate one authenticated manifest on GitHub's maintained image, then
    # use those exact bytes in every platform and Docker test below.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test authenticated hash generation
        run: python3 -m unittest discover -s scripts -p 'test_generate_ingestr_hashes.py'
      - name: Authenticate pinned ingestr and generate embedded hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_ingestr_hashes.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ingestr-hashes
          path: pkg/python/ingestr_hashes.json
          if-no-files-found: error
          retention-days: 1

  test:
    needs: [verify-ingestr]
    strategy:
      matrix:
        platform: [depot-ubuntu-latest-4, depot-windows-latest-4]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          fetch-tags: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ingestr-hashes
          path: pkg/python
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"
      - name: Cache Rust artifacts
        id: rust-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pkg/sqlparser/rustffi/target
          key: rust-${{ runner.os }}-${{ hashFiles('pkg/sqlparser/rustffi/Cargo.lock', 'pkg/sqlparser/rustffi/Cargo.toml', 'pkg/sqlparser/rustffi/src/**/*.rs') }}
          restore-keys: |
            rust-${{ runner.os }}-
      - name: Touch cached Rust lib
        if: steps.rust-cache.outputs.cache-hit == 'true'
        shell: bash
        run: touch pkg/sqlparser/rustffi/target/release/libbruin_rustsqlparser.a
      - name: Setup Rust
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Run full test suite
        shell: bash
        run: |
          # Race-enabled Windows binaries need the matching MinGW runtime DLLs.
          # Installer tests inject a missing shell, so the native fallback is
          # still covered without depending on this PATH.
          [[ "${{ runner.os }}" != 'Windows' ]] || export PATH="/c/mingw64/bin:$PATH"
          make test-full
  end2end:
    needs: [verify-ingestr]
    strategy:
      matrix:
        platform: [depot-ubuntu-latest-4]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install R (background)
        run: |
          nohup bash -c 'sudo apt-get install -y --no-install-recommends r-base-core 2>/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base-core)' > /tmp/r_install.log 2>&1 &
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          fetch-tags: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ingestr-hashes
          path: pkg/python
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"
      - name: Cache Rust artifacts
        id: rust-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pkg/sqlparser/rustffi/target
          key: rust-${{ runner.os }}-${{ hashFiles('pkg/sqlparser/rustffi/Cargo.lock', 'pkg/sqlparser/rustffi/Cargo.toml', 'pkg/sqlparser/rustffi/src/**/*.rs') }}
          restore-keys: |
            rust-${{ runner.os }}-
      - name: Touch cached Rust lib
        if: steps.rust-cache.outputs.cache-hit == 'true'
        run: touch pkg/sqlparser/rustffi/target/release/libbruin_rustsqlparser.a
      - name: Setup Rust
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Wait for R
        run: |
          # Budgeted on wall clock rather than loop iterations, and generously:
          # the background apt-get fetches 30 MB, and a slow archive mirror had
          # been overrunning the old 120-iteration budget. The loop still exits
          # the moment Rscript appears, so a healthy run pays nothing for this.
          deadline=$((SECONDS + 600))
          until command -v Rscript >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::R did not become available within 600s. Install log:"
              cat /tmp/r_install.log 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          echo "R available after ${SECONDS}s"
      - name: Run integration tests
        run: make integration-test
      - name: Run MSSQL developer environment integration test
        run: make integration-test-mssql
  dockerBuild:
    # Depot build for pushes and internally-created PRs. Fork PRs cannot
    # authenticate with Depot, so they are handled by dockerBuildFork instead.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [verify-ingestr]
    runs-on: depot-ubuntu-latest
    name: Docker Build
    permissions:
      # allow issuing OIDC tokens for this workflow run
      id-token: write
      # allow at least reading the repo contents, add other permissions if necessary
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ingestr-hashes
          path: pkg/python
      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: bruin-data
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Set up Depot
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1
      - name: Build Docker image
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
            BRANCH_NAME=${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  dockerBuildFork:
    # GitHub-native build for PRs opened from forks, which cannot use Depot.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    needs: [verify-ingestr]
    runs-on: ubuntu-latest
    # Same check name as the Depot job so a required "Docker Build" status check
    # is satisfied whichever path runs (the other is skipped, which passes).
    name: Docker Build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ingestr-hashes
          path: pkg/python
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.head_ref }}
            BRANCH_NAME=${{ github.head_ref }}
  lint:
    needs: [verify-ingestr]
    runs-on: depot-ubuntu-latest-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ingestr-hashes
          path: pkg/python
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"
      - name: Cache golangci-lint analysis
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - name: Install linting tools
        run: make setup
      - name: Check formatting
        run: make format-ci
      - name: Run full lint suite
        run: make lint-full

  release-dry-run-unix:
    # Temporary release-packaging probe; no tag, publish token, or upload.
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: [verify-ingestr]
    runs-on: depot-ubuntu-latest-8
    permissions:
      contents: read
    strategy:
      matrix:
        goos: [linux, darwin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ingestr-hashes
          path: pkg/python
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
      - name: Package release snapshot without publishing
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION: v0.0.0-dry-run
          TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
          GGOOS: ${{ matrix.goos }}
        run: |
          test -s pkg/python/ingestr_hashes.json
          docker run --privileged -v /var/run/docker.sock:/var/run/docker.sock \
            -e GGOOS -e GORELEASER_KEY -e COMMIT_SHA -e VERSION -e TELEMETRY_KEY \
            -v "$(pwd):/src" -w /src goreleaser/goreleaser-cross-pro:v1.23 \
            release --snapshot --clean --split --verbose
          test -n "$(find dist -name 'bruin*' -type f -print -quit)"

  release-dry-run-windows:
    # Same snapshot path as release-windows; never uploads a release asset.
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: [verify-ingestr]
    runs-on: depot-windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ingestr-hashes
          path: pkg/python
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-libs
            mingw-w64-ucrt-x86_64-winpthreads
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
      - name: Check downloaded manifest
        run: test -s pkg/python/ingestr_hashes.json
      - name: Package Windows release snapshot without publishing
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.3.2
          distribution: goreleaser-pro
          args: release --snapshot --clean --split
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          VERSION: v0.0.0-dry-run
          COMMIT_SHA: ${{ github.sha }}
          TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
          GGOOS: windows
          CGO_ENABLED: 1
          CC: x86_64-w64-mingw32-gcc
          CGO_LDFLAGS: "-static-libgcc -static-libstdc++ -Wl,-Bstatic -lwinpthread -Wl,-Bdynamic"
      - name: Check packaged Windows binary
        run: test -f dist/windows/bruin_Windows_x86_64.zip
